<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punto de venta · Percha</title>
<meta name="app-root" content="../">
<link rel="stylesheet" href="../shell/shell.css">
<style>
  /* ===== Punto de venta: pantalla completa, pensada para tocar y vender rápido ===== */
  body.con-lateral{grid-template-columns:1fr}
  .lateral{position:fixed;left:0;top:0;bottom:0;width:min(84vw,280px);transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--sombra-flotante)}
  body.lateral-abierta .lateral{transform:none}
  .telon{position:fixed;inset:0;background:rgba(21,23,28,.3);z-index:29;display:none}
  body.lateral-abierta .telon{display:block}
  .barra-superior,.cab-pagina{display:none}
  main.app{max-width:none;padding:0;height:100vh;overflow:hidden}
  .pos{display:grid;grid-template-columns:1fr 410px;height:100vh}
  /* ---- columna izquierda ---- */
  .lado{display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px 14px 12px 16px;gap:10px}
  .filtro-stock{display:flex;align-items:center;gap:6px;font:600 12px var(--f-ui);color:var(--tinta-3);white-space:nowrap;cursor:pointer;margin-left:auto}
  .filtro-stock input{width:16px;height:16px}
  .tile-p .vchips{display:flex;flex-wrap:wrap;gap:4px;padding:0 8px 8px}
  .tile-p .vchips button{border:1px solid rgba(var(--acento-rgb),.4);background:var(--lila);color:var(--acento);border-radius:7px;padding:4px 7px;font:700 11px var(--f-ui);cursor:pointer}
  .tile-p .vchips button small{font:500 10px var(--f-mono);color:var(--tinta-3);margin-left:3px}
  /* ventana "¿qué modelos se lleva?" */
  .modal.definir{max-width:860px}
  .definir .pend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
  .definir .pend b{font:800 26px var(--f-titulo);letter-spacing:-.03em}
  .definir .elegidos{display:flex;flex-wrap:wrap;gap:6px}
  .definir .elegidos span{background:var(--ok-fondo);color:var(--ok);font:600 12px var(--f-ui);padding:4px 9px;border-radius:999px}
  .definir .grilla{grid-auto-rows:max-content;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:46vh;overflow:auto;margin-top:10px;padding:2px}
  .definir .pie{justify-content:space-between}
  .tile-p .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .mult{display:inline-flex;gap:4px;margin-left:6px}.mult button{border:1px solid var(--linea);background:#fff;border-radius:8px;padding:5px 9px;font:700 12px var(--f-mono);cursor:pointer}.mult button.on{background:var(--acento);color:#fff;border-color:var(--acento)}
  .arriba{display:flex;align-items:center;gap:10px}
  .arriba .menu{border:0;background:var(--superficie-2);border-radius:10px;width:40px;height:40px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--linea);display:grid;place-items:center;flex:none}
  .arriba .menu svg{width:20px;height:20px}
  .arriba .marca{display:flex;align-items:center;gap:8px;flex:none}
  .arriba .marca b{font:800 15px var(--f-titulo);letter-spacing:-.02em;white-space:nowrap}
  .arriba .buscador{flex:1;min-width:0;padding:9px 14px;border-radius:12px}
  .arriba .buscador input{font-size:16px}
  .arriba .reloj{font:500 12px var(--f-mono);color:var(--tinta-3);white-space:nowrap}
  .estado-caja{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .estado-caja .btn.chico{padding:7px 11px;font-size:12.5px}
  .punto{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px var(--ok-fondo)}
  .punto.off{background:var(--error);box-shadow:0 0 0 3px var(--error-fondo)}
  .familias{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;flex:none}
  .familias button{flex:none;border:1px solid var(--linea);background:var(--superficie-2);border-radius:999px;padding:9px 15px;font:600 13px var(--f-ui);color:var(--tinta-2);cursor:pointer;white-space:nowrap}
  .familias button b{font:500 11px var(--f-mono);color:var(--tinta-4);margin-left:5px}
  .familias button.on{background:var(--acento);border-color:var(--acento);color:#fff}
  .familias button.on b{color:rgba(255,255,255,.7)}
  .grilla{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));grid-auto-rows:max-content;gap:8px;align-content:start;padding:2px 4px 20px 2px}
  .grilla.con-fotos{grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:10px}
  .tile-p{background:var(--superficie-2);border:1px solid var(--linea);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .08s,box-shadow .12s;user-select:none;position:relative}
  .tile-p:hover,.tile-p:active{transform:translateY(-1px);box-shadow:0 8px 20px rgba(21,23,28,.1);border-color:rgba(var(--acento-rgb),.5)}
  .tile-p .foto{aspect-ratio:1/1;background:var(--relleno) center/cover no-repeat;display:grid;place-items:center;color:var(--tinta-4);font:700 22px var(--f-titulo)}
  .tile-p .foto.sinfoto{aspect-ratio:auto;height:54px;background:linear-gradient(145deg,rgba(var(--acento-rgb),.14),rgba(var(--acento-rgb),.04));color:var(--acento)}
  .tile-p .txt{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
  .tile-p .nom{font:600 12.5px/1.25 var(--f-ui);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tile-p .pre{font:700 15px var(--f-mono);letter-spacing:-.02em;color:var(--acento);margin-top:auto;padding-top:4px}
  .tile-p .cod{font:500 10px var(--f-mono);color:var(--tinta-4)}
  .tile-p .st{position:absolute;top:8px;right:8px;font:700 11px var(--f-mono);padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.9);color:var(--ok);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .tile-p .st.cero{color:var(--tinta-3)}
  .grilla .vacio{grid-column:1/-1}
  #resultados,#recientes{display:none}
  /* ---- columna derecha: ticket ---- */
  .ticket{background:var(--superficie-2);border-left:1px solid var(--linea);display:flex;flex-direction:column;height:100vh;padding:12px 14px}
  .ticket .cab{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .ticket .cab h2{font-size:15px}
  .ticket .cab select{border:1px solid var(--linea);background:#fff;border-radius:9px;padding:6px 8px;font-size:12.5px;max-width:150px;margin-left:auto}
  .ticket .lineas{flex:1;overflow:auto;margin:0 -6px;padding:0 6px;min-height:80px}
  .linea{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 8px;border-bottom:1px solid var(--linea-suave);border-radius:10px;cursor:pointer}
  .linea.sel{background:var(--lila);outline:1px solid rgba(var(--acento-rgb),.35)}
  .linea .n{font-weight:600;font-size:13.5px;line-height:1.25}
  .linea .v{font:500 11.5px var(--f-mono);color:var(--tinta-3)}
  .linea .promo{font:600 10.5px var(--f-mono);color:var(--ok)}
  .linea .falla{margin-top:4px;border:1px dashed #c9a24a;background:#fff8e6;color:#8a6400;border-radius:8px;padding:3px 8px;font:600 11px var(--f-ui);cursor:pointer}
  .linea .falla.on{border-style:solid;background:#f6d98a;color:#5a4100}
  .linea .t{font:700 15px var(--f-mono);text-align:right;letter-spacing:-.02em}
  .linea .ctrl{display:flex;align-items:center;gap:6px;grid-column:1/3}
  .linea .ctrl button{width:34px;height:34px;border-radius:9px;border:1px solid var(--linea);background:#fff;cursor:pointer;font-weight:700;font-size:16px}
  .linea .ctrl input{width:48px;height:34px;text-align:center;border:1px solid var(--linea);border-radius:9px;font:700 14px var(--f-mono)}
  .linea .ctrl .desc{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tinta-3)}
  .linea .ctrl .desc input{width:52px}
  .linea .ctrl .quitar{color:var(--error);border-color:transparent;background:transparent}
  .vacio-ticket{padding:40px 12px;text-align:center;color:var(--tinta-3);font-size:13px}
  .listas{display:flex;gap:4px;background:var(--relleno);padding:3px;border-radius:10px;margin:8px 0 4px}
  .listas button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:8px;font:600 12.5px var(--f-ui);color:var(--tinta-2);cursor:pointer}
  .listas button.on{background:#fff;color:var(--tinta);box-shadow:0 1px 2px rgba(21,23,28,.08)}
  .mas{display:none;gap:6px;margin:6px 0}
  .mas.ver{display:grid;grid-template-columns:1fr 1fr}
  .mas input{border:1px solid var(--linea);background:#fff;border-radius:9px;padding:7px 9px;width:100%;font-size:12.5px}
  .totales{border-top:1px solid var(--linea);padding-top:8px;margin-top:4px}
  .totales div{display:flex;justify-content:space-between;font-size:13px;padding:1px 0;color:var(--tinta-2)}
  .totales .gran{font:800 34px/1.1 var(--f-titulo);letter-spacing:-.04em;color:var(--tinta);padding-top:2px;align-items:baseline}
  .totales .gran span:first-child{font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3)}
  .totales .gran span:last-child{font-family:var(--f-mono);font-weight:700}
  /* teclado numérico */
  .teclado{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
  .teclado button{height:46px;border:1px solid var(--linea);background:#fff;border-radius:10px;font:700 17px var(--f-mono);cursor:pointer;box-shadow:0 1px 2px rgba(21,23,28,.05)}
  .teclado button:active{transform:translateY(1px)}
  .teclado button.fn{font:600 12.5px var(--f-ui);background:var(--relleno);border-color:transparent}
  .teclado button.ok{background:var(--lila);color:var(--acento);border-color:transparent;font:700 14px var(--f-ui)}
  .teclado .pantalla{grid-column:1/5;display:flex;align-items:center;justify-content:space-between;font:500 12px var(--f-ui);color:var(--tinta-3);padding:0 4px;height:20px}
  .teclado .pantalla b{font:700 16px var(--f-mono);color:var(--tinta)}
  .botonera{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
  .botonera .btn{justify-content:center;padding:11px 6px;font-size:12.5px}
  .botonera .cobrar{grid-column:1/4;font-size:17px;padding:16px;border-radius:14px}
  /* cobro: botones grandes */
  .formas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .formas button{border:1px solid var(--linea);background:var(--superficie-2);border-radius:12px;padding:14px 12px;cursor:pointer;text-align:left;font:700 14px var(--f-ui);min-height:56px}
  .formas button small{display:block;font:500 11px var(--f-mono);color:var(--tinta-3)}
  .formas button:hover{border-color:var(--acento);background:var(--lila)}
  .pagos-lista{margin:12px 0}
  .pago{display:grid;grid-template-columns:1fr 130px 34px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linea-suave)}
  .pago input{text-align:right;font:700 15px var(--f-mono);border:1px solid var(--linea);border-radius:8px;padding:8px;width:100%}
  .pago .x{border:0;background:transparent;color:var(--error);cursor:pointer;font-weight:700;font-size:18px}
  .resto{display:flex;justify-content:space-between;font:700 18px var(--f-mono);padding:8px 0}
  .resto.ok{color:var(--ok)} .resto.falta{color:var(--aviso)} .resto.vuelto{color:var(--acento)}
  .matriz-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
  .matriz-pick button{border:1px solid var(--linea);background:var(--superficie-2);border-radius:11px;padding:12px 6px;cursor:pointer;text-align:center;font:700 13px var(--f-ui);min-height:58px}
  .matriz-pick button small{display:block;font:500 11px var(--f-mono);color:var(--tinta-3);margin-top:2px}
  .matriz-pick button.sin{opacity:.4}
  .matriz-pick button:hover{border-color:var(--acento);background:var(--lila)}
  .modal .pie .btn{padding:12px 18px;font-size:14px}
  /* ---- ticket impreso ---- */
  #impresion{display:none}
  @media print{
    body.con-lateral>*{display:none!important}
    #impresion{display:block!important;font:12px/1.35 var(--f-mono);color:#000;width:72mm;margin:0;padding:2mm}
    #impresion h2{font:700 15px var(--f-ui);margin:0 0 2px;letter-spacing:0}
    #impresion .c{text-align:center}#impresion .r{text-align:right}
    #impresion table{width:100%;border-collapse:collapse}#impresion td{padding:2px 0;vertical-align:top}
    #impresion hr{border:0;border-top:1px dashed #000;margin:6px 0}
    @page{size:80mm auto;margin:0}
  }
  @media (max-width:980px){.pos{grid-template-columns:1fr 340px}.arriba .reloj{display:none}}
  @media (max-width:760px){main.app{height:auto;overflow:visible}.pos{grid-template-columns:1fr;height:auto}.ticket{height:auto;border-left:0;border-top:1px solid var(--linea)}.grilla{max-height:48vh}}
  .pick-busca{width:100%;border:1.5px solid var(--acento,#70547b);background:#fff;border-radius:10px;padding:10px 12px;font-size:15px;margin-top:10px}
  .rs-lista{display:grid;gap:8px;margin:12px 0}
  .rs-item{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:12px;padding:12px 14px;flex-wrap:wrap}
  .rs-item b{display:block;font-size:14px}.rs-item span{font-size:13.5px}
  .rs-item.falla{background:#fff8e6;border:1px solid #f0d58f}.rs-item.sin{background:#fdecee;border:1px solid #f3c2c7}
  .rs-nota{font-size:13px;color:var(--tinta-2,#555);margin:0 0 6px}
  .aviso-stock{background:#fdecee;color:#a8323a;border-radius:999px;padding:3px 10px;font:700 11.5px var(--f-ui);text-decoration:none;white-space:nowrap}
  .cambiable{cursor:pointer}.cambiable:hover{color:var(--acento,#70547b)}.lapiz{font-size:11px;opacity:.55}
  .matriz-pick button.actual{outline:2px solid var(--acento,#70547b);background:var(--lila,#efe8f3)}
  .cl-res{display:grid;gap:4px;margin-top:8px;max-height:50vh;overflow:auto}
  .cl-res button{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--linea);background:var(--superficie-2,#fff);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;font:600 13.5px var(--f-ui)}
  .cl-res button:hover{border-color:var(--acento,#70547b)}.cl-res small{color:var(--tinta-3);font-family:var(--f-mono)}
  .sinstock-chip{display:inline-block;background:#fdecee;color:#a8323a;border-radius:6px;padding:0 6px;margin-left:4px;font:700 10.5px var(--f-ui)}
  .tile-p.compacta{border-radius:12px;min-height:86px}
  .tile-p.compacta .txt{padding:10px 12px 10px;padding-right:46px}
  .tile-p.compacta .nom{font:600 13px/1.25 var(--f-ui)}
  .tile-p.compacta .pre{font-size:14px;padding-top:6px}
  .tile-p.compacta .st{top:9px;right:9px;background:var(--relleno);box-shadow:none}
  .btn-mas{width:100%;margin-top:8px;justify-content:center;gap:8px}.btn-mas small{color:var(--tinta-3);font-weight:500}.btn-mas.on{background:var(--lila);color:var(--acento)}
  /* ===== Vidrio (glassmorphism): fondo con color y paneles translúcidos ===== */
  body{background:radial-gradient(1100px 700px at 6% -12%,rgba(183,155,224,.55),transparent 62%),radial-gradient(900px 640px at 104% 8%,rgba(122,168,255,.32),transparent 60%),radial-gradient(900px 700px at 38% 118%,rgba(255,168,204,.30),transparent 62%),#EFEBF6;background-attachment:fixed}
  main.app,.pos{background:transparent}
  .ticket{background:rgba(255,255,255,.52);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border-left:1px solid rgba(255,255,255,.75);box-shadow:-12px 0 40px rgba(60,40,90,.08)}
  .arriba .buscador,.arriba .menu{background:rgba(255,255,255,.58);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border:1px solid rgba(255,255,255,.8);box-shadow:0 4px 18px rgba(60,40,90,.08),inset 0 1px 0 rgba(255,255,255,.9)}
  .familias button{background:rgba(255,255,255,.5);border-color:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .familias button.on{background:linear-gradient(135deg,#5B4B8A,#8E72D6);border-color:transparent;box-shadow:0 6px 16px rgba(91,75,138,.35)}
  .tile-p{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 18px rgba(60,40,90,.07);border-radius:16px}
  .tile-p:hover,.tile-p:active{background:rgba(255,255,255,.78);box-shadow:inset 0 1px 0 #fff,0 12px 28px rgba(60,40,90,.14);border-color:rgba(255,255,255,.95)}
  .tile-p::after{content:"+";position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 20px/1 var(--f-ui);color:#fff;background:linear-gradient(135deg,#3D7BFF,#7A5BE0);box-shadow:0 6px 14px rgba(61,123,255,.35);pointer-events:none}
  .tile-p .vchips{padding-right:46px}
  .tile-p .st{background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .tile-p.compacta .st{background:rgba(255,255,255,.7)}
  .linea{background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);margin-bottom:6px}
  .listas{background:rgba(255,255,255,.4)}
  .botonera .btn:not(.primario){background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.8)}
  .botonera .cobrar.primario:not(:disabled){background:linear-gradient(135deg,#5B4B8A,#8E72D6);border:0;box-shadow:0 10px 24px rgba(91,75,138,.35)}
  .modal{background:rgba(255,255,255,.8)}
  body.reservado{background:radial-gradient(1000px 700px at 8% -10%,rgba(120,80,190,.35),transparent 60%),radial-gradient(900px 600px at 105% 15%,rgba(40,80,170,.28),transparent 60%),#0f0d13!important;background-attachment:fixed!important}
  body.reservado .ticket{background:rgba(24,21,30,.6);border-left-color:rgba(255,255,255,.07)}
  body.reservado .arriba .buscador,body.reservado .arriba .menu,body.reservado .linea{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.09)}
  body.reservado .tile-p{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.09);box-shadow:none}
  body.reservado .tile-p .st{background:rgba(0,0,0,.35)}
  /* ===== Modo reservado: tema oscuro ===== */
  body.reservado{--lienzo:#121016;--lienzo-2:#17141c;--tinta:#ECE8F2;--tinta-2:#CFC8D9;--tinta-3:#9C95A8;--tinta-4:#6F6979;--superficie:rgba(30,27,36,.92);--superficie-2:#221e29;--superficie-borde:rgba(255,255,255,.06);--linea:rgba(255,255,255,.11);--linea-suave:rgba(255,255,255,.06);--relleno:rgba(255,255,255,.06);--relleno-2:rgba(255,255,255,.1);--acento:#C3A6EC;--acento-rgb:195,166,236;--lila:rgba(195,166,236,.16);--ok:#6FD39B;--error:#F08A91;color:var(--tinta)}
  body.reservado main,body.reservado .pos,body.reservado .ticket,body.reservado .catalogo{background:transparent;color:var(--tinta)}
  body.reservado .modal{background:rgba(30,27,36,.98);color:var(--tinta);border-color:rgba(255,255,255,.08)}
  body.reservado input,body.reservado select,body.reservado textarea,body.reservado .linea .ctrl button,body.reservado .linea .ctrl input{background:#1b1820!important;color:var(--tinta)!important;border-color:var(--linea)!important}
  body.reservado .btn:not(.primario):not(.peligro){background:#2a2531;color:var(--tinta);border-color:var(--linea)}
  body.reservado .matriz-pick button,body.reservado .familias button:not(.on),body.reservado .cl-res button{background:#221e29;color:var(--tinta);border-color:var(--linea)}
  body.reservado .listas button{background:transparent;color:var(--tinta-2)}body.reservado .listas button.on{background:#2f2938;color:var(--tinta)}body.reservado .listas{background:rgba(255,255,255,.05)}
  #barra-reservado{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:12px;background:#000;color:#ECE8F2;border:1px solid rgba(195,166,236,.45);border-radius:999px;padding:8px 10px 8px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5);font:600 13px var(--f-ui)}
