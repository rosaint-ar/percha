<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caja · Percha</title>
<meta name="app-root" content="../">
<link rel="stylesheet" href="../shell/shell.css">
<style>
  main.app{max-width:none;padding-top:0}
  .cab-pagina{display:none}
  .pos{display:grid;grid-template-columns:1fr 420px;gap:14px;align-items:start;min-height:calc(100vh - 70px)}
  /* ---- izquierda: búsqueda y resultados ---- */
  .panel-busqueda .buscador{min-width:0;width:100%;padding:11px 14px;border-radius:14px}
  .panel-busqueda .buscador input{font-size:16px}
  .estado-caja{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
  .estado-caja .chip{font-size:11px}
  .punto{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px var(--ok-fondo)}
  .punto.off{background:var(--error);box-shadow:0 0 0 3px var(--error-fondo)}
  .resultados{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
  .res{background:var(--superficie-2);border:1px solid var(--linea);border-radius:var(--radio-chico);padding:12px 12px 10px;cursor:pointer;transition:transform .08s,box-shadow .12s;position:relative}
  .res:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(21,23,28,.08);border-color:rgba(var(--acento-rgb),.5)}
  .res .nom{font-weight:600;font-size:13.5px;line-height:1.25;margin-bottom:4px}
  .res .cod{font:500 10.5px var(--f-mono);color:var(--tinta-3)}
  .res .pre{font:700 15px var(--f-mono);letter-spacing:-.02em;margin-top:6px;color:var(--acento)}
  .res .st{position:absolute;top:10px;right:10px}
  .matriz-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:10px}
  .matriz-pick button{border:1px solid var(--linea);background:var(--superficie-2);border-radius:9px;padding:8px 6px;cursor:pointer;text-align:center;font:600 12px var(--f-ui)}
  .matriz-pick button small{display:block;font:500 10px var(--f-mono);color:var(--tinta-3)}
  .matriz-pick button.sin{opacity:.45}
  .matriz-pick button:hover{border-color:var(--acento);background:var(--lila)}
  .recientes{margin-top:18px}
  .recientes h3{margin-bottom:8px;color:var(--tinta-3);font-size:11px;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
  /* ---- derecha: ticket ---- */
  .ticket{position:sticky;top:64px;display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
  .ticket .lineas{flex:1;overflow:auto;margin:0 -8px;padding:0 8px}
  .linea{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:9px 0;border-bottom:1px solid var(--linea-suave)}
  .linea .n{font-weight:600;font-size:13px;line-height:1.25}
  .linea .v{font:500 11px var(--f-mono);color:var(--tinta-3)}
  .linea .promo{font:600 10.5px var(--f-mono);color:var(--ok)}
  .linea .falla{margin-top:4px;border:1px dashed #c9a24a;background:#fff8e6;color:#8a6400;border-radius:8px;padding:3px 8px;font:600 11px var(--f-ui);cursor:pointer}
  .linea .falla.on{border-style:solid;background:#f6d98a;color:#5a4100}
  .linea .t{font:700 14px var(--f-mono);text-align:right;letter-spacing:-.02em}
  .linea .ctrl{display:flex;align-items:center;gap:6px;grid-column:1/3}
  .linea .ctrl button{width:26px;height:26px;border-radius:7px;border:1px solid var(--linea);background:var(--superficie-2);cursor:pointer;font-weight:700}
  .linea .ctrl input{width:44px;text-align:center;border:1px solid var(--linea);border-radius:7px;padding:3px;font:600 13px var(--f-mono)}
  .linea .ctrl .desc{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tinta-3)}
  .linea .ctrl .desc input{width:48px}
  .linea .ctrl .quitar{margin-left:4px;color:var(--error);border-color:transparent;background:transparent}
  .ticket .sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .ticket .sel select,.ticket .sel input{border:1px solid var(--linea);background:var(--superficie-2);border-radius:9px;padding:7px 9px;width:100%;font-size:12.5px}
  .listas{display:flex;gap:4px;background:var(--relleno);padding:3px;border-radius:9px;margin:10px 0 6px}
  .listas button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:7px;font:600 12px var(--f-ui);color:var(--tinta-2);cursor:pointer}
  .listas button.on{background:var(--superficie-2);color:var(--tinta);box-shadow:0 1px 2px rgba(21,23,28,.08)}
  .totales{border-top:1px solid var(--linea);padding-top:10px;margin-top:6px}
  .totales div{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;color:var(--tinta-2)}
  .totales .gran{font:800 26px var(--f-titulo);letter-spacing:-.03em;color:var(--tinta);padding-top:4px}
  .totales .gran span:last-child{font-family:var(--f-mono);font-weight:700}
  .botonera{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .botonera .btn{justify-content:center;padding:11px}
  .botonera .cobrar{grid-column:1/3;font-size:15px;padding:14px}
  .vacio-ticket{padding:40px 12px;text-align:center;color:var(--tinta-3);font-size:13px}
  /* ---- cobro ---- */
  .formas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .formas button{border:1px solid var(--linea);background:var(--superficie-2);border-radius:10px;padding:10px;cursor:pointer;text-align:left;font:600 13px var(--f-ui)}
  .formas button small{display:block;font:500 11px var(--f-mono);color:var(--tinta-3)}
  .formas button:hover{border-color:var(--acento)}
  .pagos-lista{margin:12px 0}
  .pago{display:grid;grid-template-columns:1fr 120px 30px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linea-suave)}
  .pago input{text-align:right;font-family:var(--f-mono);border:1px solid var(--linea);border-radius:8px;padding:6px 8px;width:100%}
  .pago .x{border:0;background:transparent;color:var(--error);cursor:pointer;font-weight:700}
  .resto{display:flex;justify-content:space-between;font:700 15px var(--f-mono);padding:8px 0}
  .resto.ok{color:var(--ok)} .resto.falta{color:var(--aviso)} .resto.vuelto{color:var(--acento)}
  /* ---- ticket impreso ---- */
  #impresion{display:none}
  @media print{
    body.con-lateral>*{display:none!important}
    #impresion{display:block!important;font:12px/1.35 var(--f-mono);color:#000;width:72mm;margin:0;padding:2mm}
    #impresion h2{font:700 15px var(--f-ui);margin:0 0 2px;letter-spacing:0}
    #impresion .c{text-align:center}#impresion .r{text-align:right}
    #impresion table{width:100%;border-collapse:collapse}#impresion td{padding:2px 0;vertical-align:top}
    #impresion hr{border:0;border-top:1px dashed #000;margin:6px 0}
    @page{size:80mm auto;margin:0}
  }
  @media (max-width:1000px){.pos{grid-template-columns:1fr}.ticket{position:static;max-height:none}}
  .pick-busca{width:100%;border:1.5px solid var(--acento,#70547b);background:#fff;border-radius:10px;padding:10px 12px;font-size:15px;margin-top:10px}
  .rs-lista{display:grid;gap:8px;margin:12px 0}
  .rs-item{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:12px;padding:12px 14px;flex-wrap:wrap}
  .rs-item b{display:block;font-size:14px}.rs-item span{font-size:13.5px}
  .rs-item.falla{background:#fff8e6;border:1px solid #f0d58f}.rs-item.sin{background:#fdecee;border:1px solid #f3c2c7}
  .rs-nota{font-size:13px;color:var(--tinta-2,#555);margin:0 0 6px}
  .aviso-stock{background:#fdecee;color:#a8323a;border-radius:999px;padding:3px 10px;font:700 11.5px var(--f-ui);text-decoration:none;white-space:nowrap}
  .cambiable{cursor:pointer}.cambiable:hover{color:var(--acento,#70547b)}.lapiz{font-size:11px;opacity:.55}
  .matriz-pick button.actual{outline:2px solid var(--acento,#70547b);background:var(--lila,#efe8f3)}
  .cl-res{display:grid;gap:4px;margin-top:8px;max-height:50vh;overflow:auto}
  .cl-res button{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--linea);background:var(--superficie-2,#fff);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;font:600 13.5px var(--f-ui)}
  .cl-res button:hover{border-color:var(--acento,#70547b)}.cl-res small{color:var(--tinta-3);font-family:var(--f-mono)}
  .sinstock-chip{display:inline-block;background:#fdecee;color:#a8323a;border-radius:6px;padding:0 6px;margin-left:4px;font:700 10.5px var(--f-ui)}
</style>
</head>
<body data-page="caja" data-title="Caja">
<main class="app">
  <div class="pos">
    <section class="panel-busqueda">
      <div class="estado-caja" id="estado-caja"></div>
      <div class="buscador"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Escaneá el código o escribí el nombre…" autocomplete="off" autofocus><kbd>/</kbd></div>
      <div id="resultados" class="resultados"></div>
      <div class="recientes" id="recientes"></div>
    </section>
    <aside class="card ticket">
      <div class="card-cab" style="margin-bottom:6px"><div><h2 id="ticket-titulo">Ticket</h2><p class="sub" id="ticket-sub">Nueva venta</p></div><div class="acciones"><button class="btn chico" id="btn-vaciar">Vaciar</button></div></div>
      <div class="lineas" id="lineas"><div class="vacio-ticket">Escaneá o buscá una prenda para empezar.</div></div>
      <div class="listas" id="listas"></div>
      <div class="sel">
        <select id="sel-vendedora" title="Quién atendió"></select>
        <input id="sel-cliente" placeholder="Clienta (opcional)" list="dl-clientes"><datalist id="dl-clientes"></datalist>
      </div>
      <div class="sel"><input id="nota" placeholder="Nota (regalo, cambio antes del…)"><div style="display:flex;gap:6px;align-items:center"><label style="font-size:12px;color:var(--tinta-3);white-space:nowrap">Desc. general %</label><input id="desc-general" type="number" min="0" max="100" step="1" value="0" style="width:70px;text-align:right;font-family:var(--f-mono)"></div></div>
      <div class="totales" id="totales"></div>
      <div class="botonera">
        <button class="btn cobrar primario" id="btn-cobrar">Cobrar <kbd style="background:rgba(255,255,255,.2);border-color:transparent;color:#fff">Ctrl+Enter</kbd></button>
        <button class="btn" id="btn-sena">Dejar seña</button>
        <button class="btn" id="btn-cambio">Cambio / devolución</button>
      </div>
    </aside>
  </div>
</main>
<div id="impresion"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared/supabase.js"></script>
<script src="../shell/shell.js"></script>
<script src="caja.js"></script>
</body>
</html>
