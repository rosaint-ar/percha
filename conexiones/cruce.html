<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cruce de productos · Percha</title>
<meta name="app-root" content="../">
<link rel="stylesheet" href="../shell/shell.css?v=202610311313">
<style>
  .filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .pestanas{display:flex;gap:4px;background:var(--relleno);padding:3px;border-radius:10px}
  .pestanas button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font:600 13px var(--f-ui);color:var(--tinta-2);cursor:pointer}
  .pestanas button.on{background:var(--superficie-2);color:var(--tinta);box-shadow:0 1px 2px rgba(21,23,28,.08)}
  .pestanas button b{font-family:var(--f-mono);font-weight:600;margin-left:4px;color:var(--tinta-3)}
  td img{width:34px;height:34px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px;background:var(--relleno)}
  td .dif{font-family:var(--f-mono);font-weight:700}
  td .dif.mas{color:var(--ok)}td .dif.menos{color:var(--error)}
  /* dos bloques bien distintos: el local (blanco) y el canal (teñido) */
  table.lista tr.grupos th{font-size:10px;letter-spacing:.16em;color:var(--tinta-2);text-align:center;border-bottom:0;padding:10px 16px 2px}
  table.lista th.canal,table.lista td.canal{background:rgba(var(--acento-rgb),.07)}
  table.lista th.canal.ini,table.lista td.canal.ini{border-left:2px solid rgba(var(--acento-rgb),.35)}
  table.lista th.canal.fin,table.lista td.canal.fin{border-right:2px solid rgba(var(--acento-rgb),.35)}
  td.stock-local input{width:76px;text-align:right;font:700 14px var(--f-mono);border:1px solid var(--linea);border-radius:8px;padding:5px 7px;background:#fff}
  td.stock-canal{font:700 14px var(--f-mono);color:var(--tinta-2)}
  td.stock-local .n{font:700 14px var(--f-mono)}
  .sugerencias{position:absolute;z-index:5;background:var(--superficie-2);border:1px solid var(--linea);border-radius:var(--radio-chico);box-shadow:var(--sombra-flotante);max-height:260px;overflow:auto;width:min(480px,90vw)}
  .sugerencias div{padding:8px 12px;cursor:pointer;font-size:13px}.sugerencias div:hover{background:var(--lila)}.sugerencias small{font-family:var(--f-mono);color:var(--tinta-3)}
</style>
</head>
<body data-page="conexiones" data-etq="Conexiones" data-title="Cruce de productos" data-subtitle="Lo que hay en el local contra lo publicado en el canal">
<main class="app">
  <div class="filtros">
    <div class="pestanas" id="pestanas"><button class="on" data-f="todo">Todo</button><button data-f="distinto">Stock distinto<b id="n-distinto"></b></button><button data-f="sin_cruzar">Sin cruzar<b id="n-sin"></b></button><button data-f="sin_publicar">En el local pero no en <span id="nopub-canal">el canal</span><b id="n-nopub"></b></button><button data-f="nuevos">Nuevos en <span id="nuevos-canal">el canal</span><b id="n-nuevos"></b></button></div>
    <div class="buscador" style="min-width:240px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar"></div>
    <span class="sub" id="resumen" style="margin-left:auto"></span>
  </div>
  <div class="card" style="padding:0"><table class="lista" id="tb"><thead></thead><tbody></tbody></table><div id="mas" style="padding:12px;text-align:center;display:none"><button class="btn" id="btn-mas">Ver más</button></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared/supabase.js?v=202610311313"></script>
<script src="../shell/shell.js?v=202610311313"></script>
<script>
APP.ready.then(async () => {
  const { fmt, esc, $, $$, toast, modal, confirmar, mensajeError } = APP, e = APP.empresa.id;
  const params = new URLSearchParams(location.search); let cxId = params.get('c');
  if (!cxId) { const { data } = await sb.from('conexiones').select('id').eq('empresa_id', e).limit(1).maybeSingle(); cxId = data && data.id; }
  if (!cxId) { $('main').innerHTML = '<div class="card"><p>No hay ningún canal conectado todavía. <a href="conexiones.html">Conectar</a></p></div>'; return; }
  const { data: cx } = await sb.from('conexiones').select('canal,nombre').eq('id', cxId).maybeSingle();
  const CANAL = { tiendanube: 'Tienda Nube', mercadolibre: 'Mercado Libre' }[(cx || {}).canal] || 'el canal';
  $('.cab-pagina .sub').textContent = `Lo que hay en el local contra lo publicado en ${CANAL}. El stock local es el que manda.`;
  $('#nopub-canal').textContent = CANAL; $('#nuevos-canal').textContent = CANAL;
  $('#acciones-pagina').innerHTML = `<a class="btn" href="conexiones.html">← Conexiones</a>`;
  let filtro = 'todo', pagina = 0, filas = [], variantesPercha = null;
  const PAG = 150, puedeEditar = APP.rol !== 'visor';
  // manda al canal lo que quedó en cola (fire-and-forget; el cron lo repite si falla)
  async function empujar() { try { const { data: { session } } = await sb.auth.getSession(); fetch(`${SUPABASE_URL}/functions/v1/tn-push`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}` }, body: JSON.stringify({ empresa_id: e }) }); } catch (_) {} }
  async function contar() {
    const { data: r } = await sb.rpc('resumen_conexion', { c: cxId }); const x = r || {};
    $('#n-distinto').textContent = fmt.num(x.stock_distinto || 0); $('#n-sin').textContent = fmt.num(x.sin_cruzar || 0); $('#n-nopub').textContent = fmt.num(x.percha_sin_publicar || 0); $('#n-nuevos').textContent = fmt.num(x.nuevos || 0);
  }
  let pedido = 0;
  async function cargar(reiniciar) {
    if (reiniciar) { pagina = 0; filas = []; }
    const q = $('#q').value.trim(), mio = ++pedido;   // si llega otra carga mientras tanto, esta se descarta (evita filas duplicadas)
    let data;
    if (filtro === 'nuevos') {
      // productos del canal que no tienen producto propio en el local: se crean tal cual (nombre, foto, precio, variantes) con código automático
      let c = sb.from('v_canal_nuevos').select('*').eq('conexion_id', cxId).order('sku').order('nombre').range(pagina * PAG, pagina * PAG + PAG - 1);
      if (q) c = c.or(`nombre.ilike.%${q}%,sku.ilike.%${q}%`);
      ({ data } = await c); if (mio !== pedido) return;
      $('#tb thead').innerHTML = `<tr><th>Producto en ${esc(CANAL)}</th><th>SKU</th><th class="num">Variantes</th><th class="num">Stock ${esc(CANAL)}</th><th class="num">Precio</th><th>Hoy en el local</th><th></th></tr>`;
      filas = filas.concat(data || []);
      const creables = filas.filter(x => !x.es_pack && x.publicado !== false);   // los ocultos del canal se crean uno por uno, si hace falta
      $('#tb tbody').innerHTML = filas.map(x => `<tr><td>${x.imagen ? `<img src="${esc(x.imagen)}" alt="">` : ''}${esc(x.nombre)}${x.publicado === false ? ' <span class="chip gris">oculto</span>' : ''}</td><td class="mono">${esc(x.sku || '')}</td><td class="num">${fmt.num(x.variantes)}</td><td class="num stock-canal">${x.stock == null ? '—' : fmt.num(x.stock)}</td><td class="num">${fmt.pesos(x.precio)}</td>
          <td>${x.estado === 'bolsa' ? `<span class="chip aviso">en la bolsa</span> <small style="color:var(--tinta-3)">${esc(x.bolsa_codigo || '')} ${esc(x.bolsa_nombre || '')} · ${fmt.num(x.bolsa_modelos)} modelos</small>` : '<span class="chip error">sin cruzar</span>'}</td>
          <td style="white-space:nowrap">${APP.esAdmin ? (x.es_pack ? '<span class="chip gris" title="Los packs van como kits, después de las prendas sueltas">pack</span>' : `<button class="btn chico primario" data-crear-prod="${esc(x.producto_ext)}">Crear en el local</button>`) : ''}</td></tr>`).join('') || `<tr><td colspan="7" class="vacio">Todo lo de ${esc(CANAL)} tiene su producto en el local.</td></tr>`;
      if (APP.esAdmin && creables.length) $('#tb tbody').insertAdjacentHTML('afterbegin', `<tr><td colspan="7" style="background:var(--lila)"><b>${fmt.num(creables.length)}</b> productos publicados en esta vista se pueden crear en el local de una vez (los packs y los ocultos quedan para después). Cada uno sale con código automático, foto, precio y variantes de ${esc(CANAL)}; si hoy apuntan a una bolsa, se llevan el stock que ${esc(CANAL)} tenía publicado. <button class="btn chico primario" id="btn-crear-todos" style="margin-left:8px">Crear los ${fmt.num(creables.length)}</button></td></tr>`);
      const crearVarios = async (exts) => {
        let creados = 0, errores = [];
        for (let i = 0; i < exts.length; i += 20) {
          toast(`Creando… ${fmt.num(Math.min(i + 20, exts.length))} de ${fmt.num(exts.length)}`);
          const { data: r, error } = await sb.rpc('canal_crear_productos', { p_conexion: cxId, p_exts: exts.slice(i, i + 20) });
          if (error) { errores.push(mensajeError(error)); break; }
          creados += (r.creados || []).length; errores = errores.concat((r.errores || []).map(x => x.error));
        }
        toast(`${fmt.num(creados)} productos creados en el local${errores.length ? ' · ' + errores.length + ' con error: ' + errores[0] : ''}`, errores.length ? 'error' : '');
        empujar(); contar(); cargar(true);
      };
      $$('[data-crear-prod]').forEach(b => b.onclick = () => { b.disabled = true; crearVarios([b.dataset.crearProd]); });
      const bt = $('#btn-crear-todos'); if (bt) bt.onclick = async () => { if (!await confirmar(`Se crean ${fmt.num(creables.length)} productos en el local con código automático. ¿Seguimos?`, 'Crear')) return; bt.disabled = true; crearVarios(creables.map(x => x.producto_ext)); };
    } else if (filtro === 'sin_publicar') {
      let c = sb.from('v_variantes_sin_canal').select('*').eq('conexion_id', cxId).order('producto_nombre').range(pagina * PAG, pagina * PAG + PAG - 1);
      if (q) c = c.or(`producto_nombre.ilike.%${q}%,sku.ilike.%${q}%`);
      ({ data } = await c); if (mio !== pedido) return;
      $('#tb thead').innerHTML = '<tr><th>Prenda en el local</th><th>Talle · color</th><th>SKU</th><th class="num">Stock local</th><th class="num">Precio</th></tr>';
      filas = filas.concat(data || []);
      $('#tb tbody').innerHTML = filas.map(v => `<tr><td>${esc(v.producto_nombre)}</td><td>${esc([v.talle_nombre, v.color_nombre].filter(Boolean).join(' · ') || 'único')}</td><td class="mono">${esc(v.sku || '')}</td><td class="num stock-local"><span class="n">${fmt.num(v.stock)}</span></td><td class="num">${fmt.pesos(v.precio)}</td></tr>`).join('') || `<tr><td colspan="5" class="vacio">Todo lo del local está en ${esc(CANAL)}.</td></tr>`;
    } else {
      let c = sb.from('v_cruce_canal').select('*').eq('conexion_id', cxId).order('nombre').order('valores').range(pagina * PAG, pagina * PAG + PAG - 1);
      if (filtro === 'distinto') c = c.eq('estado_stock', 'distinto'); if (filtro === 'sin_cruzar') c = c.is('variante_id', null);
      if (q) c = c.or(`nombre.ilike.%${q}%,sku.ilike.%${q}%,valores.ilike.%${q}%`);
      ({ data } = await c); if (mio !== pedido) return;
      $('#tb thead').innerHTML = `<tr class="grupos"><th colspan="2">En el local</th><th colspan="4" class="canal ini fin">En ${esc(CANAL)}</th><th colspan="2"></th></tr>
        <tr><th>Prenda</th><th class="num">Stock local</th><th class="canal ini">Publicación</th><th class="canal">SKU</th><th class="num canal">Stock ${esc(CANAL)}</th><th class="num canal fin">Precio</th><th class="num" title="Local menos ${esc(CANAL)}">Dif.</th><th></th></tr>`;
      filas = filas.concat(data || []);
      $('#tb tbody').innerHTML = filas.map(x => { const dif = x.variante_id && x.stock != null ? (+x.stock_percha - +x.stock) : null;
        return `<tr><td>${x.variante_id ? `${esc(x.producto_percha)}<br><small style="color:var(--tinta-3)">${esc([x.talle_nombre, x.color_nombre].filter(Boolean).join(' · ') || 'único')} · <span class="chip ${x.cruce === 'manual' ? '' : 'ok'}">${x.cruce}</span></small>` : '<span class="chip error">sin cruzar</span>'}</td>
          <td class="num stock-local">${x.variante_id ? (puedeEditar ? `<input type="number" step="1" value="${Math.round(+x.stock_percha)}" data-stock="${x.variante_id}" title="Editar el stock del local (se registra como ajuste y se manda a ${esc(CANAL)})">` : `<span class="n">${fmt.num(x.stock_percha)}</span>`) : ''}</td>
          <td class="canal ini">${x.imagen ? `<img src="${esc(x.imagen)}" alt="">` : ''}${esc(x.nombre)}<br><small style="color:var(--tinta-3)">${esc(x.valores || '')}${x.publicado === false ? ' · <span class="chip gris">oculto</span>' : ''}</small></td><td class="mono canal">${esc(x.sku || x.mpn || '')}</td><td class="num canal stock-canal">${x.stock == null ? '<span class="chip gris">sin control</span>' : fmt.num(x.stock)}</td><td class="num canal fin">${fmt.pesos(x.precio)}${x.precio_promo ? `<br><small style="color:var(--ok)">${fmt.pesos(x.precio_promo)}</small>` : ''}</td>
          <td class="num">${dif == null ? '' : `<span class="dif ${dif > 0 ? 'mas' : dif < 0 ? 'menos' : ''}">${dif > 0 ? '+' : ''}${fmt.num(dif)}</span>`}</td>
          <td style="white-space:nowrap">${APP.esAdmin ? (x.variante_id ? `${dif != null && dif !== 0 ? `<button class="btn chico" data-igualar="${x.variante_id}" data-canal="${x.stock_canal_grupo}" title="Poner en el local el stock que dice ${esc(CANAL)}">Usar ${fmt.num(x.stock_canal_grupo)}</button> ` : ''}${+x.variantes_canal_mismo_item > 1 && !x.talle_nombre && !x.color_nombre && (x.talle_canal || x.color_canal) ? `<button class="btn chico primario" data-crear="${x.id}" title="En el local es un artículo único: crea la variante ${esc(x.valores || '')} con el stock de ${esc(CANAL)}">Dividir en el local</button> ` : ''}<button class="btn chico" data-cruzar="${x.id}">Cambiar</button>` : `${x.talle_canal || x.color_canal ? `<button class="btn chico primario" data-crear="${x.id}" title="Crea en el local la variante ${esc(x.valores || '')} y la cruza">Crear en el local</button> ` : ''}<button class="btn chico" data-cruzar="${x.id}">Cruzar</button>`) : ''}</td></tr>`; }).join('') || '<tr><td colspan="8" class="vacio">Nada en esta vista.</td></tr>';
      $$('[data-cruzar]').forEach(b => b.onclick = () => cruzar(filas.find(x => String(x.id) === b.dataset.cruzar)));
      $$('[data-crear]').forEach(b => b.onclick = async () => { b.disabled = true; const { data, error } = await sb.rpc('canal_crear_variante', { p_item: +b.dataset.crear }); if (error) { toast(mensajeError(error), 'error'); b.disabled = false; return; } toast('Variante creada en el local y cruzada'); empujar(); contar(); cargar(true); });
      $$('[data-igualar]').forEach(b => b.onclick = async () => { const { error } = await sb.rpc('ajustar_stock', { p_variante: b.dataset.igualar, p_nuevo: +b.dataset.canal, p_nota: 'Conciliación: se tomó el stock del canal' }); if (error) { toast(mensajeError(error), 'error'); return; } toast('Stock del local actualizado'); empujar(); contar(); cargar(true); });
      $$('input[data-stock]').forEach(i => i.onchange = async () => { const { error } = await sb.rpc('ajustar_stock', { p_variante: i.dataset.stock, p_nuevo: +i.value || 0, p_nota: 'Conciliación desde el cruce' }); if (error) { toast(mensajeError(error), 'error'); return; } toast('Stock del local actualizado · se manda al canal'); empujar(); contar(); cargar(true); });
    }
    $('#mas').style.display = (data || []).length === PAG ? 'block' : 'none';
    $('#resumen').textContent = `${fmt.num(filas.length)} filas`;
  }
  async function cruzar(item) {
    if (!variantesPercha) { let d = 0, t = []; while (true) { const { data } = await sb.from('v_variantes').select('id,producto_nombre,producto_codigo,sku,talle_nombre,color_nombre,stock').eq('empresa_id', e).eq('activa', true).order('producto_nombre').range(d, d + 999); t = t.concat(data || []); if (!data || data.length < 1000) break; d += 1000; } variantesPercha = t; }
    const m = modal(`<h2>Cruzar con una prenda del local</h2><p class="sub">${esc(item.nombre)} · ${esc(item.valores || '')} · SKU ${esc(item.sku || item.mpn || '—')}</p>
      <div class="campo" style="margin-top:12px;position:relative"><label>Buscar en el local</label><input id="cz-q" placeholder="Nombre o código" value="${esc(item.sku || '')}"><div class="sugerencias" id="cz-sug" style="display:none"></div></div>
      <div class="pie">${item.variante_id ? '<button class="btn" data-quitar style="margin-right:auto">Quitar cruce</button>' : ''}<button class="btn" data-no>Cancelar</button></div>`);
    const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const buscar = () => { const t = norm($('#cz-q', m).value.trim()); const pal = t.split(/\s+/).filter(Boolean); const res = pal.length ? variantesPercha.filter(v => pal.every(w => norm(`${v.producto_nombre} ${v.producto_codigo} ${v.sku} ${v.talle_nombre} ${v.color_nombre}`).includes(w))).slice(0, 30) : [];
      const s = $('#cz-sug', m); s.innerHTML = res.map(v => `<div data-v="${v.id}">${esc(v.producto_nombre)} · ${esc([v.talle_nombre, v.color_nombre].filter(Boolean).join(' · ') || 'único')} <small>${esc(v.sku || '')} · stock ${fmt.num(v.stock)}</small></div>`).join('') || '<div class="vacio">Nada</div>'; s.style.display = 'block';
      $$('[data-v]', s).forEach(d => d.onclick = async () => { const r = await sb.from('canal_items').update({ variante_id: d.dataset.v, cruce: 'manual' }).eq('id', item.id); if (r.error) { toast(mensajeError(r.error), 'error'); return; } m.cerrar(); toast('Cruzado'); contar(); cargar(true); }); };
    $('#cz-q', m).addEventListener('input', buscar); buscar();
    $('[data-no]', m).onclick = () => m.cerrar();
    const qt = $('[data-quitar]', m); if (qt) qt.onclick = async () => { await sb.from('canal_items').update({ variante_id: null, cruce: 'ninguno' }).eq('id', item.id); m.cerrar(); contar(); cargar(true); };
  }
  $$('#pestanas button').forEach(b => b.onclick = () => { $$('#pestanas button').forEach(x => x.classList.toggle('on', x === b)); filtro = b.dataset.f; cargar(true); });
  let t; $('#q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => cargar(true), 250); });
  $('#btn-mas').onclick = () => { pagina++; cargar(false); };
  await contar(); await cargar(true);
});
</script>
</body>
</html>
