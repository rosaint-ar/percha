<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conexiones · Percha</title>
<meta name="app-root" content="../">
<link rel="stylesheet" href="../shell/shell.css?v=202610271534">
<style>
  .canales{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .canal-card .logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:800 16px var(--f-titulo);color:#fff}
  .canal-card .cab{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .canal-card .cab h2{margin:0}.canal-card .cab .sub{font-size:12.5px}
  .datos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .dato{background:var(--relleno);border-radius:10px;padding:10px 12px}
  .dato b{display:block;font:700 20px var(--f-titulo);letter-spacing:-.03em}.dato span{font-size:11.5px;color:var(--tinta-3)}
  .dato.mal b{color:var(--error)}.dato.bien b{color:var(--ok)}
  .pasos{font-size:13.5px;color:var(--tinta-2);margin:0;padding-left:18px}
  @media (max-width:900px){.canales{grid-template-columns:1fr}}
</style>
</head>
<body data-page="conexiones" data-etq="Sistema" data-title="Conexiones" data-subtitle="Canales de venta online conectados a Percha: catálogo, stock y pedidos">
<main class="app">
  <div class="canales">
    <div class="card canal-card" id="tn">
      <div class="cab"><div class="logo" style="background:#2c3357">TN</div><div><h2>Tienda Nube</h2><p class="sub">Tu tienda online. Se conecta en un clic con tu usuario de Tienda Nube.</p></div></div>
      <div id="tn-cuerpo"><p class="sub">Cargando…</p></div>
    </div>
    <div class="card canal-card" id="ml">
      <div class="cab"><div class="logo" style="background:#ffe600;color:#2d3277">ML</div><div><h2>Mercado Libre</h2><p class="sub">Publicaciones, stock y ventas de Mercado Libre.</p></div></div>
      <div class="aviso-caja info">Próximamente. Se conecta igual que Tienda Nube: con un clic y la autorización de la cuenta.</div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared/supabase.js?v=202610271534"></script>
<script src="../shell/shell.js?v=202610271534"></script>
<script>
APP.ready.then(async () => {
  const { fmt, esc, $, $$, toast, confirmar, mensajeError } = APP, e = APP.empresa.id;
  if (!APP.esAdmin) { $('main').innerHTML = '<div class="card"><p>Las conexiones las maneja administración.</p></div>'; return; }
  const params = new URLSearchParams(location.search);
  if (params.get('tn') === 'ok') toast('Tienda Nube conectada'); if (params.get('tn') === 'error') toast('No se pudo conectar: ' + (params.get('detalle') || ''), 'error');
  async function llamar(fn, body) {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(`${SUPABASE_URL}/functions/v1/${fn}`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}` }, body: JSON.stringify(Object.assign({ empresa_id: e }, body || {})) });
    const j = await r.json().catch(() => ({ error: 'Respuesta inválida' })); if (!r.ok || j.error) throw new Error(j.error || 'Error ' + r.status); return j;
  }
  async function cargarTN() {
    const { data: cx } = await sb.from('conexiones').select('*').eq('empresa_id', e).eq('canal', 'tiendanube').order('creada').limit(1).maybeSingle();
    const cuerpo = $('#tn-cuerpo');
    if (!cx) {
      cuerpo.innerHTML = `<ol class="pasos"><li>Tocá <b>Conectar Tienda Nube</b>.</li><li>Entrá con tu usuario de Tienda Nube y aceptá.</li><li>Volvés acá con la tienda conectada y el catálogo cruzado.</li></ol>
        <div style="margin-top:14px"><button class="btn primario" id="btn-conectar">Conectar Tienda Nube</button></div>`;
      $('#btn-conectar').onclick = async () => { try { const j = await llamar('tn-conectar', { volver: location.href.split('?')[0] }); location.href = j.url; } catch (err) { toast(err.message, 'error'); } };
      return;
    }
    const { data: r } = await sb.rpc('resumen_conexion', { c: cx.id }); const res = r || {};
    cuerpo.innerHTML = `<p style="margin:0 0 4px"><span class="chip ${cx.estado === 'activa' ? 'ok' : 'error'}">${cx.estado === 'activa' ? 'conectada' : cx.estado}</span> <b>${esc(cx.nombre || '')}</b> <small class="mono">#${esc(cx.externo_id)}</small>${cx.url ? ` · <a href="${esc(cx.url)}" target="_blank">ver tienda</a>` : ''}</p>
      <p class="sub">${cx.ultima_sync ? 'Última sincronización ' + fmt.fechaHora(cx.ultima_sync) : 'Todavía no se sincronizó'}${cx.ultimo_error ? ' · <span style="color:var(--error)">' + esc(cx.ultimo_error) + '</span>' : ''}</p>
      <div class="datos"><div class="dato"><b>${fmt.num(res.items || 0)}</b><span>variantes publicadas</span></div><div class="dato ${res.sin_cruzar ? 'mal' : 'bien'}"><b>${fmt.num(res.sin_cruzar || 0)}</b><span>sin cruzar con el local</span></div><div class="dato ${res.stock_distinto ? 'mal' : 'bien'}"><b>${fmt.num(res.stock_distinto || 0)}</b><span>con stock distinto</span></div></div>
      <label style="display:flex;gap:10px;align-items:center;margin:4px 0 12px;font-size:13.5px"><input type="checkbox" id="chk-empujar" ${cx.empujar_stock ? 'checked' : ''} style="width:18px;height:18px"> <span><b>El local manda el stock a Tienda Nube.</b> Cada venta, compra o ajuste en el local actualiza la tienda online al instante. <small class="sub">Solo para lo que está cruzado.</small></span></label>
      <div class="acciones"><button class="btn primario" id="btn-sync">Sincronizar catálogo</button><a class="btn" href="cruce.html?c=${cx.id}">Ver cruce de productos</a><button class="btn" id="btn-tomar" title="Hasta el corte: el local toma de Tienda Nube el stock, el nombre y las variantes de todo lo cruzado, y crea lo que falte">Tomar todo de Tienda Nube</button><button class="btn" id="btn-todo" title="Manda a Tienda Nube el stock del local de todo lo cruzado">Enviar todo el stock a Tienda Nube</button><button class="btn" id="btn-pedidos">Pedidos recientes</button><button class="btn peligro" id="btn-desconectar">Desconectar</button></div>`;
    $('#chk-empujar').onchange = async ev => { const r = await sb.from('conexiones').update({ empujar_stock: ev.target.checked }).eq('id', cx.id); toast(r.error ? mensajeError(r.error) : (ev.target.checked ? 'El local manda el stock a Tienda Nube' : 'Empuje desactivado'), r.error ? 'error' : ''); cx.empujar_stock = ev.target.checked; };
    $('#btn-todo').onclick = async () => {
      if (!cx.empujar_stock) { toast('Primero activá "El local manda el stock"', 'error'); return; }
      if (!await confirmar(`Se va a escribir en Tienda Nube el stock del local de las ${fmt.num(res.cruzados || 0)} variantes cruzadas. Lo que diga Tienda Nube hoy se pisa. ¿Seguimos?`, 'Enviar todo')) return;
      const { data: n, error } = await sb.rpc('encolar_todo', { p_conexion: cx.id }); if (error) { toast(mensajeError(error), 'error'); return; }
      toast(`${fmt.num(n)} variantes en cola: se envían en un minuto`); llamar('tn-push', {}).catch(() => {});
    };
    $('#btn-tomar').onclick = async () => {
      if (!await confirmar('Tienda Nube manda: el local toma de la tienda el stock, el nombre y las variantes de todo lo cruzado, y se crean los productos que falten. Queda todo registrado como ajustes. ¿Seguimos?', 'Tomar todo')) return;
      const b = $('#btn-tomar'); b.disabled = true; b.textContent = 'Tomando…';
      try {
        const { data: r1, error: e1 } = await sb.rpc('canal_tomar_todo', { p_conexion: cx.id }); if (e1) throw e1;
        const { data: r2, error: e2 } = await sb.rpc('canal_crear_todos', { p_conexion: cx.id }); if (e2) throw e2;
        toast(`Stock ajustado en ${fmt.num(r1.stock_ajustados)} variantes · ${fmt.num(r1.nombres_cambiados)} nombres · ${fmt.num(r1.variantes_apagadas)} variantes apagadas · ${fmt.num((r2.creados || []).length)} productos creados`);
      } catch (err) { toast(mensajeError(err), 'error'); }
      cargarTN();
    };
    $('#btn-pedidos').onclick = async () => {
      const m = APP.modal('<h2>Pedidos recientes de Tienda Nube</h2><p class="sub">Cargando…</p>');
      try { const j = await llamar('tn-pedidos', { conexion_id: cx.id, solo_ver: true }); const p = (j.resumen || [])[0] || { pedidos: [] };
        m.querySelector('.modal').innerHTML = `<h2>Pedidos recientes de Tienda Nube</h2><p class="sub">Desde ${fmt.fechaHora(p.desde)} · ${p.pedidos.length} pedidos. Los pagados entran como ventas en el local cuando la importación está activa.</p>
          <table class="lista" style="margin-top:10px">${p.pedidos.map(x => `<tr><td class="mono">#${esc(String(x.numero))}</td><td>${fmt.fechaHora(x.fecha)}<br><small>${esc(x.cliente || '')}</small></td><td><span class="chip ${x.pago === 'paid' ? 'ok' : 'gris'}">${esc(x.pago)}</span> ${x.ya_importado ? '<span class="chip">importado</span>' : ''}</td><td><small>${x.lineas.map(l => `${l.cantidad}× ${esc(l.nombre)} ${l.cruzado ? '' : '<span class="chip error">sin cruzar</span>'}`).join('<br>')}</small></td><td class="num">${fmt.pesos(x.total)}</td></tr>`).join('') || '<tr><td class="vacio">Sin pedidos en el período.</td></tr>'}</table>
          <div class="pie"><button class="btn" onclick="this.closest('.modal-fondo').remove()">Cerrar</button><button class="btn primario" id="btn-importar">Importar los pagados ahora</button></div>`;
        m.querySelector('#btn-importar').onclick = async () => { if (!await confirmar('Los pedidos pagados que no estén importados se registran como ventas y descuentan stock en el local. ¿Seguimos?', 'Importar')) return; try { const r = await llamar('tn-pedidos', { conexion_id: cx.id }); const q = (r.resumen || [])[0] || {}; toast(`${q.nuevos || 0} ventas nuevas · ${q.anulados || 0} anuladas · ${q.con_problema || 0} con avisos`); m.cerrar(); } catch (err) { toast(err.message, 'error'); } };
      } catch (err) { m.cerrar(); toast(err.message, 'error'); }
    };
    $('#btn-sync').onclick = async () => { const b = $('#btn-sync'); b.disabled = true; b.textContent = 'Sincronizando…'; try { const j = await llamar('tn-sync', { conexion_id: cx.id }); toast(`${fmt.num(j.variantes)} variantes leídas · ${fmt.num(j.cruzados)} cruzadas · ${fmt.num(j.sin_cruzar)} sin cruzar`); } catch (err) { toast(err.message, 'error'); } cargarTN(); };
    $('#btn-desconectar').onclick = async () => { if (!await confirmar('¿Desconectar Tienda Nube? Se borra el cruce guardado; no se toca nada en la tienda.', 'Desconectar')) return; await sb.from('conexiones').delete().eq('id', cx.id); cargarTN(); };
  }
  await cargarTN();
});
</script>
</body>
</html>
