<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conexiones · Percha</title>
<meta name="app-root" content="../">
<link rel="stylesheet" href="../shell/shell.css?v=202610311443">
<style>
  .canales{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .canal-card .logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:800 16px var(--f-titulo);color:#fff}
  .canal-card .cab{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .canal-card .cab h2{margin:0}.canal-card .cab .sub{font-size:12.5px}
  .datos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .dato{background:var(--relleno);border-radius:10px;padding:10px 12px}
  .dato b{display:block;font:700 20px var(--f-titulo);letter-spacing:-.03em}.dato span{font-size:11.5px;color:var(--tinta-3)}
  .dato.mal b{color:var(--error)}.dato.bien b{color:var(--ok)}
  details.avanzado{margin-top:16px;border-top:1px solid var(--linea-suave);padding-top:10px}
  details.avanzado summary{cursor:pointer;font:600 13px var(--f-ui);color:var(--tinta-2)}
  .av-fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}.av-fila .btn{min-width:230px}
  .pasos{font-size:13.5px;color:var(--tinta-2);margin:0;padding-left:18px}
  @media (max-width:900px){.canales{grid-template-columns:1fr}}
  /* precios en la tienda online */
  .pw-grid{display:grid;grid-template-columns:minmax(260px,1.4fr) minmax(200px,1fr) minmax(200px,1fr);gap:14px 18px;align-items:start;margin-bottom:14px}
  @media (max-width:860px){.pw-grid{grid-template-columns:1fr}}
  .pw-grid .campo{margin:0}
  .regla{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .regla input{width:84px!important;text-align:center;font:700 16px var(--f-mono)!important}.regla select{width:auto!important}
  .ejemplo{font-size:12.5px;color:var(--tinta-3);margin-top:6px}.ejemplo b{color:var(--tinta);font-family:var(--f-mono)}
  .fila-sw{display:flex;align-items:center;gap:10px;min-height:38px;font-size:13.5px}
  .bloque{border-top:1px solid var(--linea-suave);padding-top:14px;margin-top:14px}
  .bloque h3{font:700 14px var(--f-ui);margin:0 0 4px}
  .rev-tabla{max-height:52vh;overflow:auto;border:1px solid var(--linea-suave);border-radius:12px;margin-top:10px}
  .rev-tabla s{color:var(--tinta-3)}
</style>
</head>
<body data-page="conexiones" data-etq="Sistema" data-title="Conexiones" data-subtitle="Canales de venta online conectados a Percha: catálogo, stock y pedidos">
<main class="app">
  <div class="canales">
    <div class="card canal-card" id="tn">
      <div class="cab"><div class="logo" style="background:#2c3357">TN</div><div><h2>Tienda Nube</h2><p class="sub">Tu tienda online. Se conecta en un clic con tu usuario de Tienda Nube.</p></div></div>
      <div id="tn-cuerpo"><p class="sub">Cargando…</p></div>
    </div>
    <div class="card canal-card" id="ml">
      <div class="cab"><div class="logo" style="background:#ffe600;color:#2d3277">ML</div><div><h2>Mercado Libre</h2><p class="sub">Publicaciones, stock y ventas de Mercado Libre.</p></div></div>
      <div class="aviso-caja info">Próximamente. Se conecta igual que Tienda Nube: con un clic y la autorización de la cuenta.</div>
    </div>
  </div>
  <div class="card" id="precios" style="margin-top:14px;display:none"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared/supabase.js?v=202610311443"></script>
<script src="../shared/precios.js?v=202610311443"></script>
<script src="../shell/shell.js?v=202610311443"></script>
<script>
APP.ready.then(async () => {
  const { fmt, esc, $, $$, toast, confirmar, mensajeError } = APP, e = APP.empresa.id;
  if (!APP.esAdmin) { $('main').innerHTML = '<div class="card"><p>Las conexiones las maneja administración.</p></div>'; return; }
  const params = new URLSearchParams(location.search);
  if (params.get('tn') === 'ok') toast('Tienda Nube conectada'); if (params.get('tn') === 'error') toast('No se pudo conectar: ' + (params.get('detalle') || ''), 'error');
  async function llamar(fn, body) {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(`${SUPABASE_URL}/functions/v1/${fn}`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}` }, body: JSON.stringify(Object.assign({ empresa_id: e }, body || {})) });
    const j = await r.json().catch(() => ({ error: 'Respuesta inválida' })); if (!r.ok || j.error) throw new Error(j.error || 'Error ' + r.status); return j;
  }
  async function cargarTN() {
    const { data: cx } = await sb.from('conexiones').select('*').eq('empresa_id', e).eq('canal', 'tiendanube').order('creada').limit(1).maybeSingle();
    const cuerpo = $('#tn-cuerpo');
    if (!cx) {
      cuerpo.innerHTML = `<ol class="pasos"><li>Tocá <b>Conectar Tienda Nube</b>.</li><li>Entrá con tu usuario de Tienda Nube y aceptá.</li><li>Volvés acá con la tienda conectada y el catálogo cruzado.</li></ol>
        <div style="margin-top:14px"><button class="btn primario" id="btn-conectar">Conectar Tienda Nube</button></div>`;
      $('#btn-conectar').onclick = async () => { try { const j = await llamar('tn-conectar', { volver: location.href.split('?')[0] }); location.href = j.url; } catch (err) { toast(err.message, 'error'); } };
      return;
    }
    const { data: r } = await sb.rpc('resumen_conexion', { c: cx.id }); const res = r || {};
    cuerpo.innerHTML = `<p style="margin:0 0 6px"><span class="chip ${cx.estado === 'activa' ? 'ok' : 'error'}">${cx.estado === 'activa' ? 'conectada' : cx.estado}</span> <b>${esc(cx.nombre || '')}</b>${cx.url ? ` · <a href="${esc(cx.url)}" target="_blank">ver tienda</a>` : ''}</p>
      ${cx.ultimo_error ? `<p class="sub" style="color:var(--error)">${esc(cx.ultimo_error)}</p>` : ''}
      <div class="datos"><div class="dato"><b>${fmt.num(res.items || 0)}</b><span>prendas publicadas</span></div><div class="dato ${res.sin_cruzar ? 'mal' : 'bien'}"><b>${fmt.num(res.sin_cruzar || 0)}</b><span>sin cruzar con el local</span></div><div class="dato ${res.stock_distinto ? 'mal' : 'bien'}"><b>${fmt.num(res.stock_distinto || 0)}</b><span>con stock distinto</span></div></div>
      <div class="fila-sw" style="align-items:flex-start"><label class="switch" style="margin-top:2px"><input type="checkbox" id="chk-empujar" ${cx.empujar_stock ? 'checked' : ''}><span></span></label><span><b>Stock compartido con la web</b><br><small class="sub">Cada venta, compra o ajuste del local actualiza Tienda Nube al momento. Los pedidos de la web entran solos como ventas.</small></span></div>
      <div class="acciones" style="margin-top:12px"><a class="btn primario" href="cruce.html?c=${cx.id}">Ver cruce de productos</a><button class="btn" id="btn-pedidos">Pedidos recientes</button></div>
      <details class="avanzado"><summary>Opciones avanzadas</summary>
        <p class="sub" style="margin:6px 0 10px">Se usan pocas veces. Las que tienen ⚠ cambian muchos datos de una sola vez: usalas solo si sabés para qué.</p>
        <div class="fila-sw" style="align-items:flex-start"><label class="switch" style="margin-top:2px"><input type="checkbox" id="chk-ocultos" ${cx.incluir_ocultos ? 'checked' : ''}><span></span></label><span><b>Tener en cuenta los productos ocultos de la tienda</b><br><small class="sub">Apagado, lo oculto en Tienda Nube no cuenta para nada. Hoy hay ${fmt.num(res.ocultos || 0)} ocultos.</small></span></div>
        <div class="av-fila"><button class="btn" id="btn-sync">Sincronizar catálogo</button><small class="sub">Vuelve a leer los productos de la web (los nuevos y los cambios). ${cx.ultima_sync ? 'Última: ' + fmt.fechaHora(cx.ultima_sync) : 'Nunca se hizo.'}</small></div>
        <div class="av-fila"><button class="btn" id="btn-todo">⚠ Enviar todo el stock a la web</button><small class="sub">Pisa el stock de Tienda Nube con el del local en todo lo cruzado.</small></div>
        <div class="av-fila"><button class="btn" id="btn-tomar">⚠ Tomar todo de la web</button><small class="sub">Al revés: el local toma el stock, los nombres y las variantes de Tienda Nube.</small></div>
        <div class="av-fila"><button class="btn peligro" id="btn-desconectar">Desconectar Tienda Nube</button><small class="sub">Borra el cruce guardado. No toca nada en la tienda.</small></div>
      </details>`;
    $('#chk-empujar').onchange = async ev => { const r = await sb.from('conexiones').update({ empujar_stock: ev.target.checked }).eq('id', cx.id); toast(r.error ? mensajeError(r.error) : (ev.target.checked ? 'El local manda el stock a Tienda Nube' : 'Empuje desactivado'), r.error ? 'error' : ''); cx.empujar_stock = ev.target.checked; };
    $('#chk-ocultos').onchange = async ev => { const r = await sb.from('conexiones').update({ incluir_ocultos: ev.target.checked }).eq('id', cx.id); toast(r.error ? mensajeError(r.error) : (ev.target.checked ? 'Los ocultos de la tienda ahora cuentan' : 'Los ocultos de la tienda no cuentan para nada'), r.error ? 'error' : ''); if (r.error) ev.target.checked = !ev.target.checked; else { cx.incluir_ocultos = ev.target.checked; cargarTN(); } };
    $('#btn-todo').onclick = async () => {
      if (!cx.empujar_stock) { toast('Primero activá "El local manda el stock"', 'error'); return; }
      if (!await confirmar(`Se va a escribir en Tienda Nube el stock del local de las ${fmt.num(res.cruzados || 0)} variantes cruzadas. Lo que diga Tienda Nube hoy se pisa. ¿Seguimos?`, 'Enviar todo')) return;
      const { data: n, error } = await sb.rpc('encolar_todo', { p_conexion: cx.id }); if (error) { toast(mensajeError(error), 'error'); return; }
      toast(`${fmt.num(n)} variantes en cola: se envían en un minuto`); llamar('tn-push', {}).catch(() => {});
    };
    $('#btn-tomar').onclick = async () => {
      if (!await confirmar('Tienda Nube manda: el local toma de la tienda el stock, el nombre y las variantes de todo lo cruzado, y se crean los productos que falten. Queda todo registrado como ajustes. ¿Seguimos?', 'Tomar todo')) return;
      const b = $('#btn-tomar'); b.disabled = true; b.textContent = 'Tomando…';
      try {
        const { data: r1, error: e1 } = await sb.rpc('canal_tomar_todo', { p_conexion: cx.id }); if (e1) throw e1;
        const { data: r2, error: e2 } = await sb.rpc('canal_crear_todos', { p_conexion: cx.id }); if (e2) throw e2;
        toast(`Stock ajustado en ${fmt.num(r1.stock_ajustados)} variantes · ${fmt.num(r1.nombres_cambiados)} nombres · ${fmt.num(r1.variantes_apagadas)} variantes apagadas · ${fmt.num((r2.creados || []).length)} productos creados`);
      } catch (err) { toast(mensajeError(err), 'error'); }
      cargarTN();
    };
    $('#btn-pedidos').onclick = async () => {
      const m = APP.modal('<h2>Pedidos recientes de Tienda Nube</h2><p class="sub">Cargando…</p>');
      try { const j = await llamar('tn-pedidos', { conexion_id: cx.id, solo_ver: true }); const p = (j.resumen || [])[0] || { pedidos: [] };
        m.querySelector('.modal').innerHTML = `<h2>Pedidos recientes de Tienda Nube</h2><p class="sub">Desde ${fmt.fechaHora(p.desde)} · ${p.pedidos.length} pedidos. Los pagados entran como ventas en el local cuando la importación está activa.</p>
          <table class="lista" style="margin-top:10px">${p.pedidos.map(x => `<tr><td class="mono">#${esc(String(x.numero))}</td><td>${fmt.fechaHora(x.fecha)}<br><small>${esc(x.cliente || '')}</small></td><td><span class="chip ${x.pago === 'paid' ? 'ok' : 'gris'}">${esc(x.pago)}</span> ${x.ya_importado ? '<span class="chip">importado</span>' : ''}</td><td><small>${x.lineas.map(l => `${l.cantidad}× ${esc(l.nombre)} ${l.cruzado ? '' : '<span class="chip error">sin cruzar</span>'}`).join('<br>')}</small></td><td class="num">${fmt.pesos(x.total)}</td></tr>`).join('') || '<tr><td class="vacio">Sin pedidos en el período.</td></tr>'}</table>
          <div class="pie"><button class="btn" onclick="this.closest('.modal-fondo').remove()">Cerrar</button><button class="btn primario" id="btn-importar">Importar los pagados ahora</button></div>`;
        m.querySelector('#btn-importar').onclick = async () => { if (!await confirmar('Los pedidos pagados que no estén importados se registran como ventas y descuentan stock en el local. ¿Seguimos?', 'Importar')) return; try { const r = await llamar('tn-pedidos', { conexion_id: cx.id }); const q = (r.resumen || [])[0] || {}; toast(`${q.nuevos || 0} ventas nuevas · ${q.anulados || 0} anuladas · ${q.con_problema || 0} con avisos`); m.cerrar(); } catch (err) { toast(err.message, 'error'); } };
      } catch (err) { m.cerrar(); toast(err.message, 'error'); }
    };
    $('#btn-sync').onclick = async () => { const b = $('#btn-sync'); b.disabled = true; b.textContent = 'Sincronizando…'; try { const j = await llamar('tn-sync', { conexion_id: cx.id }); toast(`${fmt.num(j.variantes)} variantes leídas · ${fmt.num(j.cruzados)} cruzadas · ${fmt.num(j.sin_cruzar)} sin cruzar`); } catch (err) { toast(err.message, 'error'); } cargarTN(); };
    $('#btn-desconectar').onclick = async () => { if (!await confirmar('¿Desconectar Tienda Nube? Se borra el cruce guardado; no se toca nada en la tienda.', 'Desconectar')) return; await sb.from('conexiones').delete().eq('id', cx.id); cargarTN(); };
    cargarPrecios(cx);
  }

  // ================= Precios en Tienda Nube: la lista de la conexión, el envío y los descuentos =================
  async function cargarPrecios(cx) {
    const card = $('#precios'); card.style.display = '';
    let ctx = await PRECIOS.cargar(sb, e);
    let lista = ctx.listas.find(l => l.canal === 'tiendanube');
    if (!lista) {   // conexión nueva: su lista arranca igual que la base (la web no cambia)
      const r = await sb.from('listas_precios').insert(APP.conEmpresa({ nombre: 'Tienda Nube', porcentaje: 100, orden: 90, redondeo: '10+', toma_rebajas: true, canal: 'tiendanube', conexion_id: cx.id })).select('*').single();
      if (r.error) { card.innerHTML = `<p class="sub">No se pudo crear la lista de Tienda Nube: ${esc(mensajeError(r.error))}</p>`; return; }
      ctx = await PRECIOS.cargar(sb, e); lista = ctx.listas.find(l => l.canal === 'tiendanube');
    }
    const { data: promos } = await sb.from('promociones').select('*').eq('empresa_id', e).eq('tipo', 'rebaja').order('creada', { ascending: false });
    const web = (promos || []).filter(p => !p.canales || !p.canales.length || p.canales.includes('tiendanube'));
    const nFijos = {}; for (const p of web) { const { count } = await sb.from('rebaja_precios').select('id', { count: 'exact', head: true }).eq('promocion_id', p.id); nFijos[p.id] = count || 0; }
    const base = ctx.base, EJ = 50000, ej = PRECIOS.calcular({ id: '', producto_id: '', precio: EJ }, lista.id, ctx, { sinRebajas: true }).precio;
    const queTxt = p => (+p.valor > 0 ? `${fmt.dec(p.valor)}% menos` + (p.alcance === 'familias' ? ` en ${(p.familia_ids || []).length} familias` : p.alcance === 'productos' ? ` en ${(p.producto_ids || []).length} productos` : ' en todo') : '') + (nFijos[p.id] ? (+p.valor > 0 ? ' · ' : '') + `${fmt.num(nFijos[p.id])} precios de oferta` : '');
    const volver = encodeURIComponent('../conexiones/conexiones.html#precios');
    card.innerHTML = `<div class="card-cab"><div><h2>Precios en Tienda Nube</h2><p class="sub">Hoy: <b>${cx.empujar_precios ? 'los precios se cambian en Percha y pasan solos a la web' : 'los precios se cambian en el panel de Tienda Nube'}</b>.</p></div></div>
      <div class="campo" style="max-width:560px;margin-bottom:12px"><label>Precio en la web</label>${PRECIOS.reglaControles(lista.porcentaje, 'w')}<p class="ejemplo">Ej.: una prenda de <b>${fmt.pesos(EJ)}</b> en el local, en la web <b>${fmt.pesos(ej)}</b></p></div>
      <div class="fila-sw" style="align-items:flex-start"><label class="switch" style="margin-top:2px"><input type="checkbox" id="chk-precios" ${cx.empujar_precios ? 'checked' : ''}><span></span></label><span><b>Los precios se manejan desde Percha</b><br><small class="sub">Prendido: precios y descuentos se cambian acá y llegan solos a la web. Lo que se cambie a mano en el panel de Tienda Nube vuelve a quedar como en Percha.${cx.ultimo_envio_precios ? ' Último control: ' + fmt.fechaHora(cx.ultimo_envio_precios) + '.' : ''}</small></span></div>
      <div class="acciones" style="margin-top:10px"><button class="btn" id="btn-revisar">Comparar con la web</button></div>
      <div class="bloque"><div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:240px"><h3>Descuentos en la web</h3><p class="sub" style="margin:0">Como en el panel de Tienda Nube: un % o un precio de oferta, para todo, una familia o productos elegidos, con fechas. En la web se ven con el precio tachado.</p></div><a class="btn primario" href="../configuracion/promociones.html?nueva=rebaja&canal=tiendanube&volver=${volver}">+ Nuevo descuento</a></div>
        <table class="lista" style="margin-top:10px"><tr><th>Descuento</th><th>Qué</th><th>Vigencia</th><th>Dónde</th><th></th></tr>
          ${web.map(p => `<tr><td><b>${esc(p.nombre)}</b></td><td>${queTxt(p) || '—'}</td><td><small>${p.desde ? fmt.fecha(p.desde) : 'ya'}${p.hasta ? ' → ' + fmt.fecha(p.hasta) : ' · sin fin'}</small></td><td>${!p.canales || !p.canales.length ? '<span class="chip aviso" title="También vale en la caja del local">web y local</span>' : '<span class="chip">solo web</span>'}</td>
            <td style="white-space:nowrap"><label class="switch" title="${p.activa ? 'Activo' : 'Pausado'}"><input type="checkbox" data-act="${p.id}" ${p.activa ? 'checked' : ''}><span></span></label> <a class="btn chico" href="../configuracion/promociones.html?editar=${p.id}&volver=${volver}">Editar</a></td></tr>`).join('') || '<tr><td colspan="5" class="vacio">Sin descuentos: la web muestra el precio de la lista.</td></tr>'}</table>
        <p class="sub" style="margin-top:8px">Los descuentos por medio de pago (por ejemplo, transferencia) se configuran en el panel de Tienda Nube.</p></div>
      <details class="avanzado"><summary>Opciones avanzadas</summary>
        <div class="av-fila"><span style="min-width:230px"><b>Redondeo</b></span><select data-red>${PRECIOS.REDONDEOS.map(([k, t]) => `<option value="${k}" ${(lista.redondeo || '10+') === k ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div class="fila-sw" style="align-items:flex-start"><label class="switch" style="margin-top:2px"><input type="checkbox" data-reb ${lista.toma_rebajas !== false ? 'checked' : ''}><span></span></label><span><b>Las rebajas del local también valen en la web</b><br><small class="sub">Apagado, la web solo toma los descuentos de acá abajo.</small></span></div>
      </details>`;
    const recargar = () => cargarPrecios(cx);
    const guardar = async (d, msg) => { const r = await sb.from('listas_precios').update(d).eq('id', lista.id); toast(r.error ? mensajeError(r.error) : msg, r.error ? 'error' : ''); recargar(); };
    PRECIOS.reglaEnganchar(card, 'w', pct => { if (pct !== +lista.porcentaje) guardar({ porcentaje: pct }, `Precio en la web: ${PRECIOS.reglaTxt(pct)}`); }, () => toast('Poné un número: cuánto % menos o más que la base', 'error'));
    $('[data-red]', card).onchange = ev => guardar({ redondeo: ev.target.value }, 'Redondeo guardado');
    $('[data-reb]', card).onchange = ev => guardar({ toma_rebajas: ev.target.checked }, ev.target.checked ? 'La web toma también las rebajas del local' : 'La web toma solo sus descuentos');
    $$('[data-act]', card).forEach(i => i.onchange = async () => { const r = await sb.from('promociones').update({ activa: i.checked }).eq('id', i.dataset.act); toast(r.error ? mensajeError(r.error) : (i.checked ? 'Descuento activo' : 'Descuento pausado'), r.error ? 'error' : ''); recargar(); });
    $('#chk-precios').onchange = async ev => {
      if (ev.target.checked) { ev.target.checked = false; revisar(true); return; }   // prenderlo pasa siempre por la revisión
      const r = await sb.from('conexiones').update({ empujar_precios: false }).eq('id', cx.id); toast(r.error ? mensajeError(r.error) : 'Percha ya no manda los precios', r.error ? 'error' : ''); cx.empujar_precios = false;
    };
    $('#btn-revisar').onclick = () => revisar(false);

    // revisar: compara con la web en vivo; aplicar: manda de a tandas hasta terminar
    async function revisar(prender) {
      const m = APP.modal('<h2>Precios de la web</h2><p class="sub">Leyendo los precios de Tienda Nube…</p>'); $('.modal', m).style.maxWidth = '860px';
      let r; try { r = ((await llamar('tn-precios', { accion: 'revisar' })).resultados || [])[0] || {}; } catch (err) { m.cerrar(); toast(err.message, 'error'); return; }
      if (r.error) { m.cerrar(); toast(r.error, 'error'); return; }
      const cs = r.cambios || [], pz = x => x == null ? '—' : fmt.pesos(x);
      const linea = (n, p) => p != null ? `<s>${pz(n)}</s> <b>${pz(p)}</b>` : `<b>${pz(n)}</b>`;
      $('.modal', m).innerHTML = `<h2>Precios de la web</h2>
        <p class="sub">Revisé ${fmt.num(r.revisadas || 0)} prendas publicadas. ${cs.length ? `<b>${fmt.num(cs.length)}</b> publicaciones tendrían otro precio en la web.` : 'La web ya tiene los precios de Percha: no hay nada para mandar.'}${r.n_sin_tocar ? ` No se tocan ${fmt.num(r.n_sin_tocar)} (dos publicaciones a distinto precio o sin precio en Percha).` : ''}</p>
        ${cs.length ? `<div class="rev-tabla"><table class="lista"><tr><th>Prenda</th><th class="num">Hoy en la web</th><th class="num">Con Percha</th></tr>${cs.slice(0, 400).map(c => `<tr><td>${esc(c.producto)}<br><small>${esc(c.variante || 'único')}${c.rebaja ? ' · ▼ ' + esc(c.rebaja) : ''}</small></td><td class="num">${linea(c.precio_antes, c.promo_antes)}</td><td class="num">${linea(c.precio, c.promo)}</td></tr>`).join('')}${cs.length > 400 ? `<tr><td colspan="3" class="vacio">y ${fmt.num(cs.length - 400)} más…</td></tr>` : ''}</table></div>` : ''}
        ${r.n_sin_tocar ? `<details style="margin-top:8px"><summary class="sub">Ver las que no se tocan</summary><small>${(r.sin_tocar || []).map(x => esc(x.producto + (x.variante ? ' · ' + x.variante : '') + ' — ' + x.por)).join('<br>')}</small></details>` : ''}
        <div class="pie"><button class="btn" data-no>Cerrar</button>${cs.length ? `<button class="btn primario" data-si>${prender ? 'Mandar y dejar prendido' : 'Mandar ' + fmt.num(cs.length) + ' cambios'}</button>` : (prender ? '<button class="btn primario" data-si>Prender</button>' : '')}</div>`;
      $('[data-no]', m).onclick = () => m.cerrar();
      const si = $('[data-si]', m); if (!si) return;
      si.onclick = async () => {
        si.disabled = true; $('[data-no]', m).disabled = true;
        let hechos = 0, errores = 0, vueltas = 0, faltan = cs.length; const errs = [];
        while (faltan > 0 && vueltas < 40) {
          si.textContent = `Mandando… ${fmt.num(hechos)} de ${fmt.num(cs.length)}`;
          let q; try { q = ((await llamar('tn-precios', { accion: 'aplicar' })).resultados || [])[0] || {}; } catch (err) { errs.push(err.message); break; }
          if (q.error) { errs.push(q.error); break; }
          hechos += q.hechos || 0; errores += q.errores || 0; errs.push(...(q.errs || [])); vueltas++;
          if (!q.hechos && (q.faltan || 0) >= faltan) break;   // no avanza: frenar
          faltan = q.faltan || 0;
        }
        if (prender && !errs.length) { const u = await sb.from('conexiones').update({ empujar_precios: true }).eq('id', cx.id); if (u.error) errs.push(mensajeError(u.error)); else cx.empujar_precios = true; }
        m.cerrar(); toast(`${fmt.num(hechos)} precios mandados a Tienda Nube${errores ? ` · ${errores} con error` : ''}${faltan > 0 ? ` · faltan ${fmt.num(faltan)}: se terminan solos en unos minutos` : ''}${prender && cx.empujar_precios ? ' · Percha manda los precios' : ''}`, errores || errs.length ? 'error' : '');
        if (errs.length) console.warn(errs);
        recargar();
      };
    }
    if (location.hash === '#precios') card.scrollIntoView({ behavior: 'smooth' });
  }
  await cargarTN();
});
</script>
</body>
</html>
