<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talles, colores y familias · Percha</title>
<meta name="app-root" content="../">
<link rel="stylesheet" href="../shell/shell.css?v=202610241603">
<style>
  .pestanas{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
  .pestanas a{font:600 13px var(--f-ui);color:var(--tinta);text-decoration:none;padding:8px 14px;border:1px solid var(--linea);background:var(--superficie-2);border-radius:10px}
  .pestanas a.on{background:var(--lila);border-color:transparent;color:var(--acento)}
  .tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start}
  table.lista input{border:1px solid var(--borde);padding:4px 7px;border-radius:2px;width:100%}
  table.lista td.num input{width:60px;text-align:right}
  input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--borde)}
  .alta{display:flex;gap:6px;margin-top:10px}
  .alta input{flex:1;border:1px solid var(--borde);padding:7px 9px;border-radius:2px}
  @media (max-width:1000px){.tres{grid-template-columns:1fr}}
</style>
</head>
<body data-page="configuracion" data-etq="Configuración" data-title="Talles, colores y familias" data-subtitle="Los ejes con los que se arman las variantes">
<main class="app">
  <div class="pestanas"><a href="empresa.html">Empresa</a><a class="on" href="atributos.html">Talles, colores y familias</a><a href="curvas.html">Curvas de talle</a><a href="promociones.html">Promociones</a><a href="usuarios.html">Usuarios</a></div>
  <p class="sub" style="margin:0 2px 12px">Los cambios se guardan solos.</p>
  <div class="tres">
    <div class="card"><div class="card-cab"><div><h2>Talles</h2><p class="sub">En el orden de la matriz</p></div><div class="acciones"><button class="btn" id="btn-talle">+ Talle</button></div></div>
      <table class="lista" id="tb-talle"><tr><th class="num">Orden</th><th>Código</th><th>Nombre</th><th></th></tr></table></div>
    <div class="card"><div class="card-cab"><div><h2>Colores y estampas</h2><p class="sub">Con su color de referencia</p></div><div class="acciones"><button class="btn" id="btn-color">+ Color</button></div></div>
      <table class="lista" id="tb-color"><tr><th>Código</th><th>Nombre</th><th>Color</th><th></th></tr></table></div>
    <div class="card"><div class="card-cab"><div><h2>Familias</h2><p class="sub">Para agrupar y filtrar</p></div><div class="acciones"><button class="btn" id="btn-cat">+ Familia</button></div></div>
      <table class="lista" id="tb-cat"><tr><th class="num">Orden</th><th>Nombre</th><th></th></tr></table></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared/supabase.js?v=202610241603"></script>
<script src="../shell/shell.js?v=202610241603"></script>
<script>
APP.ready.then(async () => {
  const { esc, $, $$, toast } = APP, e = APP.empresa.id;
  if (!APP.esAdmin) { document.querySelector('main').innerHTML = '<div class="card"><p>Esta sección es solo para administración.</p></div>'; return; }
  const borrar = '<button class="btn-eliminar" data-borrar title="Eliminar">✕</button>';
  async function cargarAtr(tipo, tb) {
    const data = (await sb.from('atributos').select('*').eq('empresa_id', e).eq('tipo', tipo).eq('activo', true).order('orden').order('nombre')).data || [];
    tb.querySelectorAll('tr').forEach((x, i) => i && x.remove());
    data.forEach(a => tb.insertAdjacentHTML('beforeend', tipo === 'talle'
      ? `<tr data-id="${a.id}"><td class="num"><input data-k="orden" type="number" value="${a.orden}" style="width:88px"></td><td><input data-k="codigo" value="${esc(a.codigo)}"></td><td><input data-k="nombre" value="${esc(a.nombre)}"></td><td>${borrar}</td></tr>`
      : `<tr data-id="${a.id}"><td><input data-k="codigo" value="${esc(a.codigo)}"></td><td><input data-k="nombre" value="${esc(a.nombre)}"></td><td><input data-k="hex" type="color" value="${a.hex || '#E6DEF0'}"></td><td>${borrar}</td></tr>`));
    APP.autoguardar(tb, 'atributos');
    $$('[data-borrar]', tb).forEach(b => b.onclick = async () => { const tr = b.closest('tr'); if (await APP.eliminar('atributos', tr.dataset.id, { nombre: $('[data-k="nombre"]', tr).value, campoActivo: 'activo' })) cargarAtr(tipo, tb); });
  }
  async function cargarCat() {
    const tb = $('#tb-cat'), data = (await sb.from('categorias').select('*').eq('empresa_id', e).eq('activa', true).order('orden').order('nombre')).data || [];
    tb.querySelectorAll('tr').forEach((x, i) => i && x.remove());
    data.forEach(c => tb.insertAdjacentHTML('beforeend', `<tr data-id="${c.id}"><td class="num"><input data-k="orden" type="number" value="${c.orden}" style="width:88px"></td><td><input data-k="nombre" value="${esc(c.nombre)}"></td><td>${borrar}</td></tr>`));
    APP.autoguardar(tb, 'categorias');
    $$('[data-borrar]', tb).forEach(b => b.onclick = async () => { const tr = b.closest('tr'); if (await APP.eliminar('categorias', tr.dataset.id, { nombre: $('[data-k="nombre"]', tr).value, campoActivo: 'activa' })) cargarCat(); });
  }
  $('#btn-talle').onclick = async () => {
    const d = await APP.formulario({ titulo: 'Nuevo talle', campos: [{ k: 'codigo', label: 'Código', requerido: true, ancho: 'c2', placeholder: 'Ej. M, 95, XL/XXL' }, { k: 'nombre', label: 'Nombre', ancho: 'c2', placeholder: 'Si es igual al código, dejalo vacío' }, { k: 'orden', label: 'Orden en la matriz', tipo: 'number', valor: 999, ayuda: 'Más chico = más a la izquierda' }],
      alGuardar: async d => { const r = await sb.from('atributos').insert(APP.conEmpresa({ tipo: 'talle', codigo: d.codigo, nombre: d.nombre || d.codigo, orden: d.orden ?? 999 })); if (r.error) throw r.error; } });
    if (d) { toast('Talle agregado'); cargarAtr('talle', $('#tb-talle')); }
  };
  $('#btn-color').onclick = async () => {
    const d = await APP.formulario({ titulo: 'Nuevo color o estampa', campos: [{ k: 'nombre', label: 'Nombre', requerido: true, ancho: 'c2', placeholder: 'Ej. Rosa viejo' }, { k: 'codigo', label: 'Código', ancho: 'c2', placeholder: 'Ej. ROV (si lo dejás vacío se arma solo)' }, { k: 'hex', label: 'Color de referencia', tipo: 'color', valor: '#E6DEF0' }],
      alGuardar: async d => { const cod = (d.codigo || String(d.nombre).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z]/g, '').slice(0, 3)).toUpperCase(); const r = await sb.from('atributos').insert(APP.conEmpresa({ tipo: 'color', codigo: cod, nombre: d.nombre, hex: d.hex, orden: 999 })); if (r.error) throw r.error; } });
    if (d) { toast('Color agregado'); cargarAtr('color', $('#tb-color')); }
  };
  $('#btn-cat').onclick = async () => {
    const d = await APP.formulario({ titulo: 'Nueva familia', campos: [{ k: 'nombre', label: 'Nombre', requerido: true, placeholder: 'Ej. MEDIAS' }],
      alGuardar: async d => { const r = await sb.from('categorias').insert(APP.conEmpresa({ nombre: d.nombre, orden: 999 })); if (r.error) throw r.error; } });
    if (d) { toast('Familia agregada'); cargarCat(); }
  };
  await Promise.all([cargarAtr('talle', $('#tb-talle')), cargarAtr('color', $('#tb-color')), cargarCat()]);
});
</script>
</body>
</html>
