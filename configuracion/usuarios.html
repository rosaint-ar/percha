<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios · Percha</title>
<meta name="app-root" content="../">
<link rel="stylesheet" href="../shell/shell.css?v=202610311337">
<style>
  .pestanas{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
  .pestanas a{font:600 13px var(--f-ui);color:var(--tinta);text-decoration:none;padding:8px 14px;border:1px solid var(--linea);background:var(--superficie-2);border-radius:10px}
  .pestanas a.on{background:var(--lila);border-color:transparent;color:var(--acento)}
  table.lista select{width:auto;min-width:150px}
  .clave{font:600 18px var(--f-ui);letter-spacing:.04em;background:var(--lila);padding:8px 12px;display:inline-block;margin:8px 0}
</style>
</head>
<body data-page="configuracion" data-etq="Configuración" data-title="Usuarios" data-subtitle="Quién entra al sistema y qué puede hacer">
<main class="app">
  <div class="pestanas"><a href="empresa.html">Empresa</a><a href="atributos.html">Talles, colores y familias</a><a href="curvas.html">Curvas de talle</a><a href="listas.html">Listas de precios</a><a href="promociones.html">Promociones</a><a href="envios.html">Envíos</a><a href="canales.html">Canales de venta</a><a href="facturacion.html">Facturación</a><a class="on" href="usuarios.html">Usuarios</a></div>
  <div class="card">
    <div class="card-cab"><div><h2>Equipo</h2><p class="sub">El rol trae permisos de base; con <b>Permisos</b> se ajusta qué ve y qué hace cada persona.</p></div><div class="acciones"><button class="btn primario" id="btn-nuevo">+ Agregar usuario</button></div></div>
    <table class="lista" id="tb"><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Puede</th><th>Activo</th><th></th></tr></table>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared/supabase.js?v=202610311337"></script>
<script src="../shell/shell.js?v=202610311337"></script>
<script>
APP.ready.then(async () => {
  const { esc, $, $$, toast, modal, confirmar, mensajeError } = APP, e = APP.empresa.id;
  if (!APP.esAdmin) { document.querySelector('main').innerHTML = '<div class="card"><p>Esta sección es solo para administración.</p></div>'; return; }
  const ROLES = { duenio: 'Dueña', admin: 'Administración', vendedora: 'Vendedora', visor: 'Solo ver' };
  // permisos (los mismos que usa la base: permisos_rol / puede)
  const PERMISOS = [
    ['Vender', [['vender', 'Vender en la caja', 'Cobrar, señas, cambios y devoluciones'], ['descuentos', 'Hacer descuentos a mano', 'Poner % de descuento en una prenda o en el ticket'], ['clientes', 'Cargar clientas', 'Dar de alta y buscar clientas']]],
    ['Ventas', [['ventas_propias', 'Ver sus ventas del día', 'Solo las que hizo, de hoy'], ['ventas_todas', 'Ver todas las ventas', 'De todos los días y de todo el equipo, con totales']]],
    ['Mercadería', [['catalogo_ver', 'Ver stock y precios', 'Buscar prendas, cuántas hay y a cuánto se venden'], ['catalogo_editar', 'Editar catálogo y stock', 'Productos, precios, etiquetas, ajustes y recuentos'], ['costos', 'Ver costos y márgenes', 'Costo de cada prenda, margen y valor del stock'], ['compras', 'Compras', 'Pedidos a proveedores y recepciones']]],
    ['Negocio', [['inicio', 'Inicio y totales', 'El tablero con lo vendido y el stock valorizado'], ['conexiones', 'Conexiones', 'Tienda Nube: stock, precios y pedidos'], ['configuracion', 'Configuración', 'Empresa, listas de precios, promociones, facturación y usuarios']]]];
  const TODOS = PERMISOS.flatMap(g => g[1]);
  const BASE = {}; await Promise.all(Object.keys(ROLES).map(async r => { const { data } = await sb.rpc('permisos_rol', { p_rol: r }); BASE[r] = data || {}; }));
  const efectivos = u => Object.assign({}, BASE[u.rol] || {}, u.permisos || {});
  const resumen = u => { const p = efectivos(u), si = TODOS.filter(([k]) => p[k]).map(x => x[1]); return si.length === TODOS.length ? 'Todo' : si.join(' · ') || 'Nada'; };
  // permisos de una persona: tildes; lo que difiere del rol queda guardado "a medida"
  function permisos(u) {
    const base = BASE[u.rol] || {}, p = efectivos(u);
    const grupo = ([g, ps]) => `<h3 style="font:700 12px var(--f-ui);color:var(--tinta-3);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em">${g}</h3>`
      + ps.map(([k, t, d]) => `<label style="display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer"><input type="checkbox" data-k="${k}" ${p[k] ? 'checked' : ''} style="width:18px;height:18px;margin-top:2px"><span><b>${t}</b> <span data-dif="${k}" style="color:var(--acento)">${!!p[k] !== !!base[k] ? '•' : ''}</span><br><small class="sub">${d}</small></span></label>`).join('');
    const m = modal(`<h2>Permisos de ${esc(u.nombre)}</h2><p class="sub">Rol: <b>${esc(ROLES[u.rol] || u.rol)}</b>. Lo marcado con • es distinto de lo que trae el rol.</p>${PERMISOS.map(grupo).join('')}
      <div class="pie"><button class="btn" data-rol style="margin-right:auto">Volver a lo del rol</button><button class="btn" data-no>Cancelar</button><button class="btn primario" data-si>Guardar</button></div>`);
    $$('[data-k]', m).forEach(i => i.onchange = () => { $(`[data-dif="${i.dataset.k}"]`, m).textContent = i.checked !== !!base[i.dataset.k] ? '•' : ''; });
    $('[data-no]', m).onclick = () => m.cerrar();
    const guardar = async perms => { const r = await sb.from('empresa_usuarios').update({ permisos: perms }).eq('empresa_id', e).eq('user_id', u.user_id); if (r.error) { toast(mensajeError(r.error), 'error'); return; } m.cerrar(); toast('Permisos guardados: se aplican cuando esa persona recarga la pantalla'); cargar(); };
    $('[data-rol]', m).onclick = () => guardar(null);
    $('[data-si]', m).onclick = () => { const d = {}; $$('[data-k]', m).forEach(i => { if (i.checked !== !!base[i.dataset.k]) d[i.dataset.k] = i.checked; }); guardar(Object.keys(d).length ? d : null); };
  }
  async function llamar(body) {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(`${SUPABASE_URL}/functions/v1/usuarios-admin`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}` }, body: JSON.stringify(Object.assign({ empresa_id: e }, body)) });
    const j = await r.json().catch(() => ({ error: 'Respuesta inválida' }));
    if (!r.ok || j.error) throw new Error(j.error || 'Error ' + r.status);
    return j;
  }
  async function cargar() {
    const { data } = await sb.from('empresa_usuarios').select('*').eq('empresa_id', e).order('nombre');
    let pines = {}; try { const r = await sb.rpc('pin_equipos_contar', { e }); (r.data || []).forEach(x => pines[x.user_id] = x.equipos); } catch (_) { }
    let correos = {}; try { correos = (await llamar({ accion: 'listar' })).correos || {}; } catch (err) { correos = { [APP.user.id]: APP.user.email }; toast('No pude traer los correos: ' + err.message, 'error'); }
    const tb = $('#tb'); tb.querySelectorAll('tr').forEach((x, i) => i && x.remove());
    (data || []).forEach(u => tb.insertAdjacentHTML('beforeend', `<tr data-id="${u.user_id}"><td>${esc(u.nombre)}${u.user_id === APP.user.id ? ' <span class="chip">vos</span>' : ''}</td><td style="white-space:nowrap">${correos[u.user_id] ? esc(correos[u.user_id]) : '<small style="color:var(--suave)">—</small>'} <button class="btn chico" data-mail title="Cambiar el correo con el que entra">✎</button></td>
      <td><select data-rol ${u.user_id === APP.user.id ? 'disabled' : ''}>${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${u.rol === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
      <td><small>${esc(resumen(u))}</small>${u.permisos && Object.keys(u.permisos).length ? ' <span class="chip aviso">a medida</span>' : ''}</td>
      <td><select data-activo ${u.user_id === APP.user.id ? 'disabled' : ''}><option value="true" ${u.activo ? 'selected' : ''}>Sí</option><option value="false" ${!u.activo ? 'selected' : ''}>No</option></select></td>
      <td style="white-space:nowrap">${u.user_id === APP.user.id || u.rol === 'duenio' ? '' : '<button class="btn chico" data-perm>Permisos</button> '}<button class="btn chico" data-clave>Nueva contraseña</button>${pines[u.user_id] ? ` <button class="btn chico" data-sinpin title="Entra con PIN en ${pines[u.user_id]} equipo${pines[u.user_id] > 1 ? 's' : ''}">Quitar PIN (${pines[u.user_id]})</button>` : ''}</td></tr>`));
    // el PIN sirve solo en los equipos donde se activó; si se pierde un celular, se apaga acá
    $$('[data-sinpin]', tb).forEach(b => b.onclick = async () => {
      const tr = b.closest('tr'), nombre = (data.find(u => u.user_id === tr.dataset.id) || {}).nombre || '';
      if (!await confirmar(`¿Quitar el PIN de ${nombre} en todos sus equipos? Va a tener que entrar con la contraseña (y ahí puede elegir un PIN nuevo).`, 'Quitar PIN')) return;
      const r = await sb.rpc('pin_equipos_quitar', { e, p_user: tr.dataset.id }); toast(r.error ? mensajeError(r.error) : 'PIN quitado', r.error ? 'error' : ''); cargar();
    });
    $$('[data-perm]', tb).forEach(b => b.onclick = () => permisos((data || []).find(u => u.user_id === b.closest('tr').dataset.id)));
    $$('[data-rol],[data-activo]', tb).forEach(sel => sel.onchange = async () => {
      const tr = sel.closest('tr'); const r = await sb.from('empresa_usuarios').update({ rol: $('[data-rol]', tr).value, activo: $('[data-activo]', tr).value === 'true' }).eq('empresa_id', e).eq('user_id', tr.dataset.id);
      toast(r.error ? mensajeError(r.error) : 'Guardado', r.error ? 'error' : ''); cargar();
    });
    // contraseña: la escribe administración (o se genera una); la anterior deja de servir
    $$('[data-clave]', tb).forEach(b => b.onclick = () => {
      const tr = b.closest('tr'), nombre = (data.find(u => u.user_id === tr.dataset.id) || {}).nombre || '';
      const m = modal(`<h2>Contraseña de ${esc(nombre)}</h2><p class="sub">La anterior deja de servir. Al menos 8 caracteres.</p>
        <div class="campo"><label>Contraseña nueva</label><div style="display:flex;gap:6px"><input id="pw-1" type="password" autocomplete="new-password" style="flex:1"><button type="button" class="btn chico" id="pw-ver">Ver</button></div></div>
        <div class="pie"><button class="btn" data-gen style="margin-right:auto">Generar una</button><button class="btn" data-no>Cancelar</button><button class="btn primario" data-si>Guardar</button></div>`);
      $('#pw-ver', m).onclick = () => { const i = $('#pw-1', m); i.type = i.type === 'password' ? 'text' : 'password'; };
      $('[data-no]', m).onclick = () => m.cerrar();
      $('[data-si]', m).onclick = async () => { const pw = $('#pw-1', m).value; if (pw.length < 8) { toast('Al menos 8 caracteres', 'error'); return; }
        try { await llamar({ accion: 'resetear', user_id: tr.dataset.id, password: pw }); m.cerrar(); toast(`Contraseña de ${nombre} cambiada`); } catch (err) { toast(err.message, 'error'); } };
      $('[data-gen]', m).onclick = async () => { try { const j = await llamar({ accion: 'resetear', user_id: tr.dataset.id }); m.cerrar(); mostrarClave(nombre, j.password); } catch (err) { toast(err.message, 'error'); } };
      setTimeout(() => $('#pw-1', m).focus(), 30);
    });
    // correo con el que entra
    $$('[data-mail]', tb).forEach(b => b.onclick = () => {
      const tr = b.closest('tr'), nombre = (data.find(u => u.user_id === tr.dataset.id) || {}).nombre || '';
      const m = modal(`<h2>Correo de ${esc(nombre)}</h2><p class="sub">Con este correo entra al sistema. La contraseña no cambia.</p>
        <div class="campo"><label>Correo</label><input id="ml-1" type="email" value="${esc(correos[tr.dataset.id] || '')}"></div>
        <div class="pie"><button class="btn" data-no>Cancelar</button><button class="btn primario" data-si>Guardar</button></div>`);
      $('[data-no]', m).onclick = () => m.cerrar();
      $('[data-si]', m).onclick = async () => { try { await llamar({ accion: 'email', user_id: tr.dataset.id, email: $('#ml-1', m).value }); m.cerrar(); toast('Correo cambiado'); cargar(); } catch (err) { toast(err.message, 'error'); } };
    });
  }
  function mostrarClave(nombre, clave) {
    modal(`<h2>Contraseña de ${esc(nombre)}</h2><p>Pasásela por un canal seguro. No se vuelve a mostrar.</p><div class="clave">${esc(clave)}</div><div class="pie"><button class="btn primario" onclick="this.closest('.modal-fondo').remove()">Listo</button></div>`, { fijo: true });
  }
  $('#btn-nuevo').onclick = () => {
    const m = modal(`<h2>Agregar usuario</h2>
      <div class="campo"><label>Nombre</label><input id="n-nombre" placeholder="Como la llaman en el local"></div>
      <div class="campo"><label>Correo</label><input id="n-email" type="email" placeholder="Con este correo ingresa"></div>
      <div class="campo"><label>Rol</label><select id="n-rol">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${k === 'vendedora' ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="pie"><button class="btn" data-no>Cancelar</button><button class="btn primario" data-si>Crear</button></div>`);
    $('[data-no]', m).onclick = () => m.cerrar();
    $('[data-si]', m).onclick = async () => {
      const b = $('[data-si]', m); b.disabled = true;
      try { const j = await llamar({ accion: 'crear', email: $('#n-email', m).value, nombre: $('#n-nombre', m).value, rol: $('#n-rol', m).value }); m.cerrar(); await cargar();
        if (j.password) mostrarClave($('#n-nombre', m).value, j.password); else toast('Ese correo ya tenía usuario: se lo vinculó a la empresa con su contraseña de siempre'); }
      catch (err) { toast(err.message, 'error'); b.disabled = false; }
    };
  };
  await cargar();
});
</script>
</body>
</html>
