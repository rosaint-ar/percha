<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promociones · Percha</title>
<meta name="app-root" content="../">
<link rel="stylesheet" href="../shell/shell.css?v=202610281703">
<style>
  .pestanas{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
  .pestanas a{font:600 13px var(--f-ui);color:var(--tinta);text-decoration:none;padding:8px 14px;border:1px solid var(--linea);background:var(--superficie-2);border-radius:10px}
  .pestanas a.on{background:var(--lila);border-color:transparent;color:var(--acento)}
  .dias{display:flex;gap:4px}.dias label{border:1px solid var(--linea);border-radius:8px;padding:5px 8px;font:600 12px var(--f-ui);cursor:pointer}.dias input{display:none}.dias input:checked+span{color:var(--acento)}.dias label:has(input:checked){background:var(--lila);border-color:transparent}
  .chips-sel{display:flex;flex-wrap:wrap;gap:6px}
  .chip-sel{border:1px solid var(--linea);background:var(--superficie-2);border-radius:999px;padding:7px 13px;font:600 12.5px var(--f-ui);cursor:pointer;color:var(--tinta-2)}
  .chip-sel.chico{padding:5px 11px;font-size:12px}
  .chip-sel.on{background:var(--acento);border-color:var(--acento);color:#fff}
  .escalones{display:grid;gap:8px}
  .esc-bloque{border:1px solid var(--linea-suave);border-radius:12px;padding:8px 10px;display:grid;gap:6px}
  .esc-canales{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;color:var(--tinta-3)}
  .esc-fila{display:flex;align-items:center;gap:8px;font:500 13.5px var(--f-ui);flex-wrap:wrap}
  .reb-tabla{max-height:320px;overflow:auto;border:1px solid var(--linea-suave);border-radius:12px}
  .reb-tabla table{width:100%;border-collapse:collapse}.reb-tabla td{padding:5px 8px;border-bottom:1px solid var(--linea-suave);font-size:13px}
  .reb-tabla input{width:110px;height:32px;border:1px solid var(--linea);border-radius:8px;text-align:right;font:600 13px var(--f-mono);background:var(--superficie-2);padding:0 8px}
  .reb-alta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.reb-alta input{height:36px;border:1px solid var(--linea);border-radius:10px;padding:0 10px;background:var(--superficie-2)}
  .picker{margin-top:8px;border:1px solid var(--linea-suave);border-radius:12px;padding:8px}
  .pk-fil{display:flex;gap:6px;flex-wrap:wrap}.pk-fil input{flex:1;min-width:180px;height:36px;border:1px solid var(--linea);border-radius:10px;padding:0 10px;background:var(--superficie-2)}.pk-fil select{height:36px;border:1px solid var(--linea);border-radius:10px;background:var(--superficie-2);padding:0 8px}
  .pk-acc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:12.5px;color:var(--tinta-3)}.pk-acc span{margin-left:auto}
  .pk-lista{max-height:260px;overflow:auto;border-top:1px solid var(--linea-suave)}
  .pk-it{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--linea-suave);font-size:13px;cursor:pointer}.pk-it span{flex:1;min-width:0}.pk-it b{font:600 12px var(--f-mono);color:var(--tinta-2)}.pk-it input{width:17px;height:17px}
  .esc-fila input{width:74px;height:38px;border:1px solid var(--linea);border-radius:10px;text-align:center;font:700 15px var(--f-mono);background:var(--superficie-2)}
</style>
</head>
<body data-page="configuracion" data-etq="Configuración" data-title="Promociones" data-subtitle="Se aplican solas en la caja; cada prenda toma la mejor promo que le corresponda">
<main class="app">
  <div class="pestanas"><a href="empresa.html">Empresa</a><a href="atributos.html">Talles, colores y familias</a><a href="curvas.html">Curvas de talle</a><a href="listas.html">Listas de precios</a><a class="on" href="promociones.html">Promociones</a><a href="envios.html">Envíos</a><a href="facturacion.html">Facturación</a><a href="usuarios.html">Usuarios</a></div>
  <div class="card"><div class="card-cab"><div><h2>Promociones</h2></div><div class="acciones"><button class="btn primario" id="btn-nueva">+ Nueva promoción</button></div></div>
    <table class="lista" id="tb"><tr><th>Nombre</th><th>Regla</th><th>Alcance</th><th>Dónde</th><th>Vigencia</th><th>Activa</th><th></th></tr></table></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared/supabase.js?v=202610281703"></script>
<script src="../shared/canales.js?v=202610281703"></script>
<script src="../shell/shell.js?v=202610281703"></script>
<script>
APP.ready.then(async () => {
  const { esc, $, $$, toast, modal, confirmar, mensajeError, fmt } = APP, e = APP.empresa.id;
  if (!APP.esAdmin) { document.querySelector('main').innerHTML = '<div class="card"><p>Esta sección es solo para administración.</p></div>'; return; }
  const [{ data: cats }, { data: prods }, { data: listas }] = await Promise.all([sb.from('categorias').select('id,nombre').eq('empresa_id', e).eq('activa', true).order('orden'), sb.from('productos').select('id,nombre,codigo,precio,categoria_id').eq('empresa_id', e).eq('activo', true).order('nombre').limit(5000), sb.from('listas_precios').select('id,nombre').eq('empresa_id', e).eq('activa', true).order('orden')]);
  const nice = s => s.charAt(0) + s.slice(1).toLowerCase();
  const canales = await CANALES.cargar(e);
  const dondeTxt = cs => !cs || !cs.length || cs.length >= canales.length ? 'Todos los canales' : cs.map(k => CANALES.nombre(canales, k)).join(' · ');
  let volver = null;   // si se abrió desde otra pantalla (la conexión), al guardar vuelve allá
  const DIAS = ['Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá', 'Do'];
  const escalonesDe = p => (p.escalones && p.escalones.length ? p.escalones : [{ n: p.n, valor: p.valor }]).slice().sort((a, b) => a.n - b.n);
  const regla = p => p.tipo === 'rebaja' ? 'Rebaja' + (+p.valor > 0 ? ` ${fmt.dec(p.valor)}% sobre Lista` : '') + (p.n_fijos ? ` · ${fmt.num(p.n_fijos)} precios de oferta` : '') : ({ porcentaje: `${p.valor}% de descuento`, monto: `${fmt.pesos(p.valor)} menos por unidad`, nxm: `Lleva ${p.n}, paga ${p.m}`, cantidad: escalonesDe(p).map(x => `${fmt.dec(x.valor)}% llevando ${x.n}+${x.canales && x.canales.length ? ' (' + dondeTxt(x.canales) + ')' : ''}`).join(' · ') })[p.tipo];
  const alcance = p => p.tipo === 'rebaja' && !(+p.valor > 0) ? 'Los productos con precio de oferta' : p.alcance === 'todo' ? 'Todas las prendas' : p.alcance === 'familias' ? (p.familia_ids || []).map(id => nice((cats.find(c => c.id === id) || {}).nombre || '')).filter(Boolean).join(', ') : `${(p.producto_ids || []).length} productos`;
  async function cargar() {
    const { data } = await sb.from('promociones').select('*').eq('empresa_id', e).order('creada', { ascending: false });
    for (const p of (data || []).filter(x => x.tipo === 'rebaja')) { const { count } = await sb.from('rebaja_precios').select('id', { count: 'exact', head: true }).eq('promocion_id', p.id); p.n_fijos = count || 0; }
    const tb = $('#tb'); tb.querySelectorAll('tr').forEach((x, i) => i && x.remove());
    (data || []).forEach(p => tb.insertAdjacentHTML('beforeend', `<tr><td><b>${esc(p.nombre)}</b></td><td>${regla(p)}</td><td>${esc(alcance(p))}</td><td><span class="chip ${p.canales && p.canales.length ? '' : 'ok'}">${esc(dondeTxt(p.canales))}</span>${p.listas && p.listas.length ? `<br><small>${esc(p.listas.map(id => (listas.find(l => l.id === id) || {}).nombre).filter(Boolean).join(', '))}</small>` : ''}</td><td><small>${p.desde ? fmt.fecha(p.desde) : 'siempre'}${p.hasta ? ' → ' + fmt.fecha(p.hasta) : ''} · ${(p.dias_semana || []).length === 7 ? 'todos los días' : (p.dias_semana || []).map(d => DIAS[d - 1]).join(' ')}</small></td><td>${p.activa ? '<span class="chip ok">activa</span>' : '<span class="chip gris">pausada</span>'}</td><td><button class="btn chico" data-e="${p.id}">Editar</button> <button class="btn chico" data-p="${p.id}">${p.activa ? 'Pausar' : 'Activar'}</button></td></tr>`));
    if (!(data || []).length) tb.insertAdjacentHTML('beforeend', '<tr><td colspan="7" class="vacio">Sin promociones. Creá la primera: por ejemplo "3 bombachas, paga 2".</td></tr>');
    $$('[data-e]', tb).forEach(b => b.onclick = () => editar(data.find(p => p.id === b.dataset.e)));
    $$('[data-p]', tb).forEach(b => b.onclick = async () => { const p = data.find(x => x.id === b.dataset.p); await sb.from('promociones').update({ activa: !p.activa }).eq('id', p.id); cargar(); });
  }
  function editar(p, previo) {
    const pk = { q: '', fam: '' };   // selector de productos (como el panel de Tienda Nube)
    p = JSON.parse(JSON.stringify(p || previo || { nombre: '', tipo: 'cantidad', escalones: [{ n: 3, valor: 10 }], valor: 0, n: 3, m: 2, alcance: 'todo', familia_ids: [], producto_ids: [], dias_semana: [1, 2, 3, 4, 5, 6, 7], activa: true, canales: null, listas: null }));
    if (p.tipo === 'cantidad') p.escalones = escalonesDe(p);
    const TIPOS = [['cantidad', 'Llevando N o más, % off'], ['nxm', 'Lleva N, paga M'], ['porcentaje', '% de descuento'], ['monto', '$ menos por prenda'], ['rebaja', 'Rebaja (precio tachado)']];
    // rebaja: precios de oferta por producto o por talle/color
    let fijos = null; const fijosOrig = new Map();
    const cargarFijos = async () => {
      fijos = [];
      if (p.id) {
        let d = 0; while (true) { const { data } = await sb.from('rebaja_precios').select('id,producto_id,variante_id,precio').eq('promocion_id', p.id).order('id').range(d, d + 999); (data || []).forEach(x => { fijos.push(Object.assign({}, x)); fijosOrig.set(x.id, +x.precio); }); if (!data || data.length < 1000) break; d += 1000; }
        const vids = [...new Set(fijos.filter(x => x.variante_id).map(x => x.variante_id))], nomV = new Map();
        for (let i = 0; i < vids.length; i += 300) { const { data } = await sb.from('v_variantes').select('id,talle_nombre,color_nombre').in('id', vids.slice(i, i + 300)); (data || []).forEach(v => nomV.set(v.id, [v.talle_nombre, v.color_nombre].filter(Boolean).join(' · '))); }
        fijos.forEach(x => { x.var_nombre = x.variante_id ? nomV.get(x.variante_id) || 'talle · color' : ''; });
        const nom = x => (prods.find(y => y.id === x.producto_id) || {}).nombre || ''; fijos.sort((a, b) => nom(a).localeCompare(nom(b)) || a.var_nombre.localeCompare(b.var_nombre));
      }
      pintar();
    };
    const filaFijo = (x, i) => { const pr = prods.find(y => y.id === x.producto_id) || {}; return `<tr><td>${esc(pr.nombre || '—')}${x.var_nombre ? ' <small>· ' + esc(x.var_nombre) + '</small>' : ''}<br><small class="mono">${esc(pr.codigo || '')} · lista ${fmt.pesos(pr.precio || 0)}</small></td><td style="text-align:right"><input data-fijo="${i}" type="number" step="1" min="0" value="${x.precio}"></td><td><button type="button" class="btn-eliminar" data-fijo-del="${i}" title="Quitar">✕</button></td></tr>`; };
    const bloqueRebaja = () => `<label>Rebaja pareja sobre Lista <small>(opcional)</small></label><div class="esc-fila"><input id="p-valor" inputmode="decimal" value="${p.valor || ''}" style="width:110px"> % menos</div>
      <span class="ayuda">Para las prendas de "A qué prendas". Deja el precio tachado, y las listas que toman rebajas (Contado, Débito) parten del precio rebajado.</span>
      <label style="margin-top:12px">Precios de oferta puntuales <small>(mandan sobre el %)</small></label>
      ${fijos == null ? '<p class="sub">Cargando…</p>' : `<div class="reb-tabla"><table>${fijos.length ? fijos.map(filaFijo).join('') : '<tr><td class="vacio">Sin precios de oferta puntuales.</td></tr>'}</table></div>
      <div class="reb-alta"><input id="f-prod" list="dl-prods-reb" placeholder="Producto (nombre o código)" style="flex:1;min-width:200px"><datalist id="dl-prods-reb">${prods.map(x => `<option value="${esc(x.codigo)} · ${esc(x.nombre)}"></option>`).join('')}</datalist><input id="f-precio" type="number" step="1" min="0" placeholder="Precio de oferta" style="width:140px"><button type="button" class="btn" id="f-mas">+ Agregar</button></div>`}`;
    const m = modal('<div id="pe"></div>'); $('.modal', m).style.maxWidth = '640px';
    const visibles = () => { const pal = pk.q.toLowerCase().split(/\s+/).filter(Boolean); return prods.filter(x => (!pk.fam || x.categoria_id === pk.fam) && pal.every(w => (x.nombre + ' ' + x.codigo).toLowerCase().includes(w))); };
    function pintarPicker() {
      const sel = new Set(p.producto_ids || []), vs = visibles(), cont = $('#pk-lista', m);
      cont.innerHTML = vs.slice(0, 300).map(x => `<label class="pk-it"><input type="checkbox" value="${x.id}" ${sel.has(x.id) ? 'checked' : ''}><span>${esc(x.nombre)} <small class="mono">${esc(x.codigo)}</small></span><b>${fmt.pesos(x.precio || 0)}</b></label>`).join('')
        + (vs.length > 300 ? `<p class="sub" style="padding:6px 10px">y ${fmt.num(vs.length - 300)} más: buscá para achicar.</p>` : '') + (!vs.length ? '<p class="sub" style="padding:6px 10px">No hay productos con ese filtro.</p>' : '');
      $('#pk-n', m).textContent = sel.size;
      $$('input', cont).forEach(i => i.onchange = () => { const s2 = new Set(p.producto_ids || []); i.checked ? s2.add(i.value) : s2.delete(i.value); p.producto_ids = [...s2]; $('#pk-n', m).textContent = s2.size; });
      $('#pk-q', m).oninput = ev => { pk.q = ev.target.value; pintarPicker(); };
      $('#pk-fam', m).onchange = ev => { pk.fam = ev.target.value; pintarPicker(); };
      $('#pk-todos', m).onclick = () => { const s2 = new Set(p.producto_ids || []); visibles().forEach(x => s2.add(x.id)); p.producto_ids = [...s2]; pintarPicker(); };
      $('#pk-ninguno', m).onclick = () => { const fuera = new Set(visibles().map(x => x.id)); p.producto_ids = (p.producto_ids || []).filter(id => !fuera.has(id)); pintarPicker(); };
    }
    const leer = () => {
      p.nombre = $('#p-nombre', m).value; p.desde = $('#p-desde', m).value || null; p.hasta = $('#p-hasta', m).value || null;
      p.dias_semana = $$('.dias input:checked', m).map(i => +i.value);
      if (p.tipo === 'cantidad') p.escalones = $$('.esc-fila', m).map((f, i) => ({ n: +$('[data-k="n"]', f).value || 0, valor: +String($('[data-k="valor"]', f).value).replace(',', '.') || 0, canales: (p.escalones[i] || {}).canales || null }));
      else if (p.tipo === 'nxm') { p.n = +$('#p-n', m).value || 0; p.m = +$('#p-m', m).value || 0; }
      else p.valor = +String($('#p-valor', m).value).replace(',', '.') || 0;
    };
    const pintar = () => {
      $('#pe', m).innerHTML = `<h2>${p.id ? 'Editar' : 'Nueva'} promoción</h2>
        <div class="campo" style="margin-top:12px"><label>Nombre (sale en el ticket)</label><input id="p-nombre" value="${esc(p.nombre)}" placeholder="Ej. Armá tu pack de bombachas"></div>
        <div class="campo"><label>Cómo funciona</label><div class="chips-sel">${TIPOS.map(([k, t]) => `<button type="button" class="chip-sel${p.tipo === k ? ' on' : ''}" data-tipo="${k}">${t}</button>`).join('')}</div></div>
        <div class="campo">${p.tipo === 'cantidad' ? `<label>Escalones</label><div class="escalones">${p.escalones.map((x, i) => `<div class="esc-bloque"><div class="esc-fila">Llevando <input data-k="n" type="number" min="2" value="${x.n}"> o más → <input data-k="valor" inputmode="decimal" value="${x.valor}"> % off${p.escalones.length > 1 ? `<button type="button" class="btn-eliminar" data-quitar="${i}" title="Quitar">✕</button>` : ''}</div>
              <div class="esc-canales"><span>Vale en:</span><button type="button" class="chip-sel chico${!x.canales || !x.canales.length ? ' on' : ''}" data-esc-canal="${i}:">Como la promo</button>${canales.filter(c => !p.canales || !p.canales.length || p.canales.includes(c.k)).map(c => `<button type="button" class="chip-sel chico${x.canales && x.canales.includes(c.k) ? ' on' : ''}" data-esc-canal="${i}:${c.k}">${esc(c.n)}</button>`).join('')}</div></div>`).join('')}</div>
            <button type="button" class="btn chico" id="p-mas-esc" style="margin-top:6px">+ Agregar escalón</button><span class="ayuda">Se aplica el escalón más alto que se alcance en ese canal: llevando 7, vale el de 6. Un escalón puede valer solo en algunos canales (por ejemplo, el de 6 solo en la tienda).</span>`
          : p.tipo === 'nxm' ? `<label>Lleva / paga</label><div class="esc-fila">Lleva <input id="p-n" type="number" min="2" value="${p.n || 3}">, paga <input id="p-m" type="number" min="1" value="${p.m || 2}"></div><span class="ayuda">Las más baratas salen gratis.</span>`
          : p.tipo === 'rebaja' ? bloqueRebaja()
          : `<label>${p.tipo === 'monto' ? 'Pesos menos por prenda' : 'Porcentaje de descuento'}</label><div class="esc-fila"><input id="p-valor" inputmode="decimal" value="${p.valor || ''}" style="width:110px"> ${p.tipo === 'monto' ? '$' : '% off'}</div>`}</div>
        <div class="campo"><label>A qué prendas</label><div class="chips-sel">${[['todo', 'Todas'], ['familias', 'Algunas familias'], ['productos', 'Algunos productos']].map(([k, t]) => `<button type="button" class="chip-sel${p.alcance === k ? ' on' : ''}" data-alc="${k}">${t}</button>`).join('')}</div>
          ${p.alcance === 'familias' ? `<div class="chips-sel" style="margin-top:8px">${cats.map(c => `<button type="button" class="chip-sel chico${(p.familia_ids || []).includes(c.id) ? ' on' : ''}" data-fam="${c.id}">${esc(nice(c.nombre))}</button>`).join('')}</div>`
          : p.alcance === 'productos' ? `<div class="picker"><div class="pk-fil"><input id="pk-q" placeholder="Buscar por nombre o código" value="${esc(pk.q)}"><select id="pk-fam"><option value="">Todas las familias</option>${cats.map(c => `<option value="${c.id}" ${pk.fam === c.id ? 'selected' : ''}>${esc(nice(c.nombre))}</option>`).join('')}</select></div>
            <div class="pk-acc"><button type="button" class="btn chico" id="pk-todos">Tildar los que se ven</button><button type="button" class="btn chico" id="pk-ninguno">Destildar los que se ven</button><span><b id="pk-n">${(p.producto_ids || []).length}</b> elegidos</span></div><div class="pk-lista" id="pk-lista"></div></div>` : ''}</div>
        <div class="campo"><label>Dónde vale</label><div class="chips-sel"><button type="button" class="chip-sel${!p.canales || !p.canales.length ? ' on' : ''}" data-canal="">Todos los canales</button>${canales.map(c => `<button type="button" class="chip-sel${p.canales && p.canales.includes(c.k) ? ' on' : ''}" data-canal="${c.k}">${esc(c.n)}</button>`).join('')}</div>
          <span class="ayuda">En la caja se aplica según el canal de la venta.${p.tipo === 'rebaja' ? ' En Tienda Nube va como precio tachado al actualizar la web desde Percha.' : canales.some(c => !['local', 'whatsapp'].includes(c.k)) ? ' En la web de cada tienda online, por ahora, la promo hay que cargarla también allá: Percha todavía no la publica.' : ''}</span></div>
        <div class="campo" ${p.tipo === 'rebaja' ? 'style="display:none"' : ''}><label>Listas de precios</label><div class="chips-sel"><button type="button" class="chip-sel chico${!p.listas || !p.listas.length ? ' on' : ''}" data-lista="todas">Todas</button>${listas.map(l => `<button type="button" class="chip-sel chico${p.listas && p.listas.includes(l.id) ? ' on' : ''}" data-lista="${l.id}">${esc(l.nombre)}</button>`).join('')}</div></div>
        <div class="fila c2"><div class="campo"><label>Desde</label><input id="p-desde" type="date" value="${p.desde || ''}"></div><div class="campo"><label>Hasta</label><input id="p-hasta" type="date" value="${p.hasta || ''}"></div></div>
        <div class="campo" ${p.tipo === 'rebaja' ? 'style="display:none"' : ''}><label>Días</label><div class="dias">${DIAS.map((d, i) => `<label><input type="checkbox" value="${i + 1}" ${(p.dias_semana || []).includes(i + 1) ? 'checked' : ''}><span>${d}</span></label>`).join('')}</div></div>
        <div class="pie">${p.id ? '<button class="btn peligro" data-del style="margin-right:auto">Borrar</button>' : ''}<button class="btn" data-no>Cancelar</button><button class="btn primario" data-si>Guardar</button></div>`;
      $$('[data-fijo]', m).forEach(i => i.onchange = () => { fijos[+i.dataset.fijo].precio = +i.value || 0; });
      $$('[data-fijo-del]', m).forEach(b => b.onclick = () => { leer(); fijos.splice(+b.dataset.fijoDel, 1); pintar(); });
      const fm = $('#f-mas', m); if (fm) fm.onclick = () => {
        const cod = $('#f-prod', m).value.split(' · ')[0].trim(), pr = prods.find(y => y.codigo === cod), precio = +$('#f-precio', m).value;
        if (!pr) { toast('Elegí un producto de la lista', 'error'); return; } if (!(precio > 0)) { toast('Poné el precio de oferta', 'error'); return; }
        if (fijos.some(x => x.producto_id === pr.id && !x.variante_id)) { toast('Ese producto ya está', 'error'); return; }
        leer(); fijos.unshift({ producto_id: pr.id, variante_id: null, precio, var_nombre: '' }); pintar();
      };
      $$('[data-tipo]', m).forEach(b => b.onclick = () => { leer(); p.tipo = b.dataset.tipo; if (p.tipo === 'rebaja' && fijos == null) cargarFijos(); if (p.tipo === 'cantidad' && !(p.escalones || []).length) p.escalones = [{ n: 3, valor: 10 }]; pintar(); });
      $$('[data-alc]', m).forEach(b => b.onclick = () => { leer(); p.alcance = b.dataset.alc; pintar(); });
      if ($('#pk-lista', m)) pintarPicker();
      $$('[data-fam]', m).forEach(b => b.onclick = () => { leer(); const s = new Set(p.familia_ids || []); s.has(b.dataset.fam) ? s.delete(b.dataset.fam) : s.add(b.dataset.fam); p.familia_ids = [...s]; pintar(); });
      $$('[data-canal]', m).forEach(b => b.onclick = () => { leer(); const k = b.dataset.canal; if (!k) p.canales = null; else { const s = new Set(p.canales || []); s.has(k) ? s.delete(k) : s.add(k); p.canales = s.size && s.size < canales.length ? [...s] : null; }
        (p.escalones || []).forEach(x => { if (x.canales && p.canales) { x.canales = x.canales.filter(c => p.canales.includes(c)); if (!x.canales.length) x.canales = null; } }); pintar(); });
      $$('[data-esc-canal]', m).forEach(b => b.onclick = () => { leer(); const [i, k] = b.dataset.escCanal.split(':'), x = p.escalones[+i]; if (!k) x.canales = null; else { const s = new Set(x.canales || []); s.has(k) ? s.delete(k) : s.add(k); x.canales = s.size ? [...s] : null; } pintar(); });
      $$('[data-lista]', m).forEach(b => b.onclick = () => { leer(); if (b.dataset.lista === 'todas') p.listas = null; else { const s = new Set(p.listas || []); s.has(b.dataset.lista) ? s.delete(b.dataset.lista) : s.add(b.dataset.lista); p.listas = s.size && s.size < listas.length ? [...s] : null; } pintar(); });
      const mas = $('#p-mas-esc', m); if (mas) mas.onclick = () => { leer(); const ult = p.escalones[p.escalones.length - 1] || { n: 2, valor: 5 }; p.escalones.push({ n: ult.n * 2, valor: Math.min(100, ult.valor + 5) }); pintar(); const ins = $$('.esc-fila [data-k="valor"]', m); ins[ins.length - 1].focus(); };
      $$('[data-quitar]', m).forEach(b => b.onclick = () => { leer(); p.escalones.splice(+b.dataset.quitar, 1); pintar(); });
      $('[data-no]', m).onclick = () => m.cerrar();
      const del = $('[data-del]', m); if (del) del.onclick = async () => { if (await confirmar('¿Borrar la promoción?', 'Borrar')) { await sb.from('promociones').delete().eq('id', p.id); m.cerrar(); cargar(); } };
      $('[data-si]', m).onclick = guardar;
    };
    const guardar = async () => {
      leer();
      if (!p.nombre.trim()) { toast('Ponele un nombre', 'error'); return; }
      if (p.tipo === 'nxm' && !(p.n > p.m && p.m > 0)) { toast('"Lleva" tiene que ser mayor que "paga"', 'error'); return; }
      if (p.tipo === 'cantidad') {
        const es = p.escalones.filter(x => x.n > 0 && x.valor > 0).sort((a, b) => a.n - b.n).map(x => ({ n: x.n, valor: x.valor, canales: x.canales && x.canales.length ? x.canales : null }));
        if (!es.length) { toast('Completá al menos un escalón', 'error'); return; }
        if (new Set(es.map(x => x.n + '|' + (x.canales || []).slice().sort().join(','))).size !== es.length) { toast('Hay dos escalones iguales (misma cantidad y mismos canales)', 'error'); return; }
        if (es.some(x => x.valor > 100)) { toast('El descuento no puede pasar el 100%', 'error'); return; }
        p.escalones = es; p.n = es[0].n; p.valor = es[0].valor;
      }
      if (p.alcance === 'familias' && !(p.familia_ids || []).length) { toast('Elegí al menos una familia', 'error'); return; }
      if (p.alcance === 'productos' && !(p.producto_ids || []).length && !(p.tipo === 'rebaja' && !(+p.valor > 0))) { toast('Tildá al menos un producto', 'error'); return; }
      if (p.tipo === 'rebaja') {
        if (+p.valor >= 100) { toast('La rebaja no puede ser del 100%', 'error'); return; }
        if (!(+p.valor > 0) && !(fijos || []).length) { toast('Poné un % de rebaja o al menos un precio de oferta', 'error'); return; }
        p.dias_semana = [1, 2, 3, 4, 5, 6, 7]; p.listas = null;
      }
      const d = { nombre: p.nombre.trim(), tipo: p.tipo, valor: p.valor || 0, n: p.n || 0, m: p.m || 0, escalones: p.tipo === 'cantidad' ? p.escalones : null, alcance: p.alcance,
        familia_ids: p.alcance === 'familias' ? p.familia_ids : [], producto_ids: p.alcance === 'productos' ? p.producto_ids : [], canales: p.canales && p.canales.length ? p.canales : null, listas: p.listas && p.listas.length ? p.listas : null,
        desde: p.desde, hasta: p.hasta, dias_semana: p.dias_semana };
      const r = p.id ? await sb.from('promociones').update(d).eq('id', p.id).select('id').single() : await sb.from('promociones').insert(APP.conEmpresa(d)).select('id').single();
      if (r.error) { toast(mensajeError(r.error), 'error'); return; }
      if (p.tipo === 'rebaja' && fijos) {   // precios de oferta: altas, cambios y bajas
        const pid = r.data.id, quedan = new Set(fijos.filter(x => x.id).map(x => x.id)), borrar = [...fijosOrig.keys()].filter(id => !quedan.has(id));
        for (let i = 0; i < borrar.length; i += 200) await sb.from('rebaja_precios').delete().in('id', borrar.slice(i, i + 200));
        for (const x of fijos.filter(x => x.id && fijosOrig.get(x.id) !== +x.precio)) await sb.from('rebaja_precios').update({ precio: +x.precio }).eq('id', x.id);
        const nuevos = fijos.filter(x => !x.id).map(x => APP.conEmpresa({ promocion_id: pid, producto_id: x.producto_id, variante_id: x.variante_id, precio: +x.precio }));
        if (nuevos.length) { const ri = await sb.from('rebaja_precios').insert(nuevos); if (ri.error) { toast(mensajeError(ri.error), 'error'); return; } }
      }
      m.cerrar(); toast('Guardada'); if (volver) { location.href = volver; return; } cargar();
    };
    pintar(); if (p.tipo === 'rebaja') cargarFijos();
  }
  $('#btn-nueva').onclick = () => editar(null);
  await cargar();
  // desde la conexión: ?nueva=rebaja&canal=tiendanube · ?editar=<id> · &volver=<página de Percha>
  const qs = new URLSearchParams(location.search);
  volver = /^\.\.\/[a-z/.#-]+$/i.test(qs.get('volver') || '') ? qs.get('volver') : null;
  if (qs.get('editar')) { const { data: pe } = await sb.from('promociones').select('*').eq('id', qs.get('editar')).maybeSingle(); if (pe) editar(pe); }
  else if (qs.get('nueva') === 'rebaja') editar(null, { nombre: '', tipo: 'rebaja', valor: 0, n: 0, m: 0, escalones: null, alcance: 'productos', familia_ids: [], producto_ids: [], dias_semana: [1, 2, 3, 4, 5, 6, 7], activa: true, canales: qs.get('canal') ? [qs.get('canal')] : null, listas: null });
});
