<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario · Percha</title>
<meta name="app-root" content="../">
<link rel="stylesheet" href="../shell/shell.css?v=202610282119">
<style>
  .tiles-inv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
  .tiles-inv .t span,.tiles-inv .t small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:1400px){.tiles-inv{grid-template-columns:repeat(6,minmax(0,1fr))}.tiles-inv .t:nth-child(-n+3){grid-column:span 2}.tiles-inv .t:nth-child(n+4){grid-column:span 3}}
  @media (max-width:700px){.tiles-inv{grid-template-columns:1fr 1fr}.tiles-inv .t:nth-child(n){grid-column:auto}.tiles-inv .t:last-child{grid-column:span 2}}
  .tiles-conf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
  .tiles-conf .t{border:1px solid var(--linea);border-radius:12px;padding:10px 14px}.tiles-conf span{display:block;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3)}.tiles-conf b{font:800 22px var(--f-titulo)}
  .tiles-inv .t{background:var(--superficie);border:1px solid var(--superficie-borde);border-radius:14px;padding:14px 16px;box-shadow:var(--sombra)}
  .tiles-inv .t span{display:block;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3)}
  .tiles-inv .t b{display:block;font:800 24px/1.2 var(--f-titulo);letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
  .tiles-inv .t small{color:var(--tinta-3);font-size:12px}
  .tiles-inv .t.alerta b{color:var(--error)}
  .pestanas-inv{display:flex;gap:4px;background:var(--relleno);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:14px}
  .pestanas-inv button,.pestanas-inv a{border:0;background:transparent;padding:9px 16px;border-radius:9px;font:600 13.5px var(--f-ui);color:var(--tinta-2);cursor:pointer;text-decoration:none;white-space:nowrap}
  .pestanas-inv .on{background:var(--superficie-2);color:var(--tinta);box-shadow:0 1px 2px rgba(21,23,28,.08)}
  .vista{animation:aparecer .18s ease-out}
  /* recuentos */
  .rec-lista{display:grid;gap:10px}
  .rec{display:grid;grid-template-columns:1fr 180px 120px auto;gap:16px;align-items:center;padding:14px 16px;border:1px solid var(--linea);border-radius:14px;background:var(--superficie-2);cursor:pointer;transition:border-color .12s,box-shadow .12s}
  .rec:hover{border-color:rgba(var(--acento-rgb),.35);box-shadow:0 6px 16px rgba(21,23,28,.06)}
  .rec b{display:block;font:700 14.5px var(--f-ui)}.rec small{color:var(--tinta-3);font-size:12.5px}
  .barra{height:7px;background:var(--relleno);border-radius:999px;overflow:hidden}.barra i{display:block;height:100%;background:var(--acento);border-radius:999px;transition:width .3s ease}
  .barra-txt{font:600 11.5px var(--f-mono);color:var(--tinta-3);margin-top:5px}
  .estado{font:700 11px var(--f-ui);border-radius:999px;padding:3px 10px;justify-self:start}
  .estado.abierto{background:var(--aviso-fondo);color:var(--aviso)}.estado.confirmado{background:var(--ok-fondo);color:var(--ok)}.estado.descartado{background:var(--relleno);color:var(--tinta-3)}
  .vacio-grande{text-align:center;padding:40px 20px;color:var(--tinta-3)}
  .vacio-grande svg{width:56px;height:56px;color:var(--acento);opacity:.55;margin-bottom:10px}
  .vacio-grande b{display:block;color:var(--tinta);font-size:15px;margin-bottom:4px}
  /* sesión de recuento */
  .ses-cab{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .ses-cab h2{margin:0}.ses-cab .prog{flex:1;min-width:200px;max-width:360px}
  .escaner{display:flex;align-items:center;gap:10px;border:2px solid rgba(var(--acento-rgb),.35);background:var(--superficie-2);border-radius:14px;padding:4px 6px 4px 14px;margin-bottom:12px}
  .escaner svg{width:22px;height:22px;color:var(--acento);flex:none}
  .escaner input{flex:1;border:0;outline:0;background:transparent;font-size:16px;height:44px}
  .escaner.ok{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok-fondo)}.escaner.mal{border-color:var(--error);box-shadow:0 0 0 4px var(--error-fondo)}
  .filtros-ses{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .seg{display:inline-flex;background:var(--relleno);border-radius:10px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font:600 12.5px var(--f-ui);color:var(--tinta-2);cursor:pointer}
  .seg button.on{background:var(--superficie-2);color:var(--tinta);box-shadow:0 1px 2px rgba(21,23,28,.08)}
  .filtros-ses input{height:36px;border:1px solid var(--linea);border-radius:10px;padding:0 12px;background:var(--superficie-2);min-width:220px;flex:1;max-width:360px}
  .prod-ses{border:1px solid var(--linea);border-radius:14px;background:var(--superficie-2);margin-bottom:10px;overflow:hidden}
  .prod-ses .cab{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--relleno)}
  .prod-ses .cab img,.prod-ses .cab .sf{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;background:var(--lila)}
  .prod-ses .cab b{font:700 13.5px var(--f-ui)}.prod-ses .cab small{color:var(--tinta-3);font:500 11.5px var(--f-mono);margin-left:6px}
  .prod-ses .cab .tot{margin-left:auto;font:600 12px var(--f-mono);color:var(--tinta-3)}
  .it{display:grid;grid-template-columns:minmax(120px,1fr) 90px 150px 90px;gap:12px;align-items:center;padding:8px 14px;border-top:1px solid var(--linea-suave)}
  .it.ciego{grid-template-columns:minmax(120px,1fr) 150px}
  .it .var{font:600 13px var(--f-ui)}.it .var small{display:block;color:var(--tinta-4);font:500 10.5px var(--f-mono)}
  .it .sis{font:600 13px var(--f-mono);color:var(--tinta-3);text-align:right}
  .contador{display:flex;align-items:center;border:1px solid var(--linea);border-radius:10px;overflow:hidden;height:36px;background:var(--superficie-2)}
  .contador button{width:36px;height:100%;border:0;background:transparent;font:700 16px var(--f-ui);cursor:pointer;color:var(--tinta-2)}
  .contador button:hover{background:var(--relleno)}
  .contador input{flex:1;width:100%;border:0;border-left:1px solid var(--linea-suave);border-right:1px solid var(--linea-suave);text-align:center;font:700 14px var(--f-mono);height:100%;background:transparent;outline:0}
  .contador.hecho{border-color:rgba(31,122,92,.45)}
  .dif{font:700 12.5px var(--f-mono);text-align:center;border-radius:8px;padding:5px 0}
  .dif.igual{color:var(--ok);background:var(--ok-fondo)}.dif.mas{color:#1F6FEB;background:rgba(31,111,235,.1)}.dif.menos{color:var(--error);background:var(--error-fondo)}.dif.nada{color:var(--tinta-4)}
  .it.flash{animation:flash 1s ease-out}
  @keyframes flash{0%{background:rgba(var(--acento-rgb),.22)}100%{background:transparent}}
  .ses-pie{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--superficie);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--superficie-borde);border-radius:14px;padding:10px 14px;margin-top:12px;box-shadow:0 -6px 20px rgba(21,23,28,.06)}
  .ses-pie .res{font-size:13px;color:var(--tinta-2)}.ses-pie .res b{font-family:var(--f-mono)}
  /* ajustar */
  .aj{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
  .aj>.card{margin-top:0}
  .busca-prod{position:relative}
  .busca-prod input{width:100%;height:42px;border:1px solid var(--linea);border-radius:12px;padding:0 14px;background:var(--superficie-2);font-size:15px}
  .sug{position:absolute;left:0;right:0;top:46px;z-index:5;background:var(--superficie-2);border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra-flotante);max-height:320px;overflow:auto}
  .sug button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 12px;text-align:left;cursor:pointer;font:inherit}
  .sug button:hover{background:var(--lila)}.sug img,.sug .sf{width:32px;height:32px;border-radius:7px;object-fit:cover;background:var(--lila);flex:none}
  .sug small{color:var(--tinta-3);font:500 11.5px var(--f-mono);margin-left:auto}
  .vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .vchip{border:1px solid var(--linea);background:var(--superficie-2);border-radius:10px;padding:7px 12px;cursor:pointer;font:600 12.5px var(--f-ui);text-align:center}
  .vchip small{display:block;font:600 11px var(--f-mono);color:var(--tinta-3)}
  .vchip.on{border-color:var(--acento);background:var(--lila);color:var(--acento)}
  .aj-form .campo select,.aj-form .campo input{height:40px}
  .motivos{display:flex;flex-wrap:wrap;gap:6px}
  .motivo{border:1px solid var(--linea);background:var(--superficie-2);border-radius:999px;padding:7px 12px;font:600 12.5px var(--f-ui);cursor:pointer}
  .motivo.on{background:var(--acento);border-color:var(--acento);color:#fff}
  .resultado{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--tinta-3);margin-top:4px}
  .resultado b{font:800 22px var(--f-mono);color:var(--tinta)}
  /* para revisar y con falla */
  .rev-lista{display:grid;gap:8px}
  .rev{display:grid;grid-template-columns:44px minmax(150px,1.2fr) minmax(0,2fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--linea);border-radius:14px;background:var(--superficie-2);padding:8px 14px 8px 8px;cursor:pointer;font:inherit;color:inherit;transition:border-color .12s,box-shadow .12s,transform .08s}
  .rev:hover{border-color:rgba(var(--acento-rgb),.4);box-shadow:0 6px 16px rgba(21,23,28,.06);transform:translateY(-1px)}
  .rev.falla{border-color:#ecd391;background:#fffaf0}
  .rev-t b{display:block;font:650 13.5px var(--f-ui)}.rev-t small{color:var(--tinta-3);font-size:12px}
  .rev-q{font-size:12.5px;color:var(--tinta-2)}.rev-q small{color:var(--tinta-3)}
  .rev-s{font:700 13px var(--f-mono);white-space:nowrap;text-align:right}.rev-s small{font:500 11.5px var(--f-ui);color:var(--tinta-3)}
  .rev-s .off{color:#8a6400}
  .mini{width:44px;height:44px;border-radius:10px;object-fit:cover;display:block;background:var(--relleno)}
  .mini.sf{display:grid;place-items:center;font:700 12px var(--f-titulo);color:var(--acento);background:linear-gradient(145deg,rgba(var(--acento-rgb),.14),rgba(var(--acento-rgb),.04))}
  .sug .mini{width:32px;height:32px;border-radius:7px}
  .vchip.neg small{color:var(--error)}
  .n-tab{font:700 10.5px var(--f-mono);background:#f6d98a;color:#5a4100;border-radius:999px;padding:1px 6px;margin-left:4px}
  .n-tab:empty{display:none}
  @media (max-width:700px){.rev{grid-template-columns:44px minmax(0,1fr) auto}.rev-q{grid-column:2/4}}
  /* movimientos */
  .filtros-mov{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .filtros-mov input,.filtros-mov select{height:36px;border:1px solid var(--linea);border-radius:10px;padding:0 10px;background:var(--superficie-2)}
  .tipo{font:700 10.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:3px 7px;white-space:nowrap}
  .tipo.venta{background:var(--lila);color:var(--acento)}.tipo.devolucion{background:rgba(31,111,235,.1);color:#1F6FEB}.tipo.ajuste{background:var(--aviso-fondo);color:var(--aviso)}.tipo.recuento{background:var(--ok-fondo);color:var(--ok)}.tipo.compra{background:rgba(15,118,110,.1);color:#0F766E}.tipo.otro{background:var(--relleno);color:var(--tinta-3)}
  .cant-mov{font:700 13px var(--f-mono)}.cant-mov.pos{color:var(--ok)}.cant-mov.neg{color:var(--error)}
  @media (max-width:1000px){.rec{grid-template-columns:1fr auto}.rec .barra-w{display:none}.aj{grid-template-columns:1fr}.it{grid-template-columns:1fr 130px}.it .sis,.it .dif{display:none}}
</style>
</head>
<body data-page="inventario" data-etq="Catálogo" data-title="Inventario" data-subtitle="Cuántas prendas tenés y en qué estado: corregir stock, fallas, recuentos y el historial de cada movimiento">
<main class="app">
  <section class="tiles-inv" id="tiles"></section>
  <nav class="pestanas-inv" id="tabs">
    <button data-tab="stock" class="on">Stock</button>
    <button data-tab="fallas">Con falla <span class="n-tab" id="n-fallas"></span></button>
    <button data-tab="recuentos">Recuentos</button>
    <a href="conteo.html">De bolsa a modelo</a>
    <button data-tab="movimientos">Movimientos</button>
  </nav>
  <div id="vista"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared/supabase.js?v=202610282119"></script>
<script src="../shared/precios.js?v=202610282119"></script>
<script src="../shared/prenda.js?v=202610282119"></script>
<script src="../shell/shell.js?v=202610282119"></script>
<script>
APP.ready.then(async () => {
  const { fmt, esc, $, $$, toast, modal, confirmar, mensajeError } = APP, e = APP.empresa.id;
  const puedeConfirmar = APP.esAdmin;
  const nrm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const IC_REC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3M9 10l2 2 4-4M9 16h6"/></svg>';
  const IC_ESC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M14 8v8M17 8v8"/></svg>';

  // ---------- recuadros ----------
  async function pintarTiles() {
    const { data: r } = await sb.rpc('inventario_resumen', { e }); if (!r) return;
    $('#tiles').innerHTML = `<div class="t"><span>Prendas en stock</span><b>${fmt.num(r.unidades)}</b><small>${fmt.num(r.variantes - r.sin_stock)} variantes con stock</small></div>
      ${APP.puede('costos') ? `<div class="t"><span>Valor a costo</span><b>${fmt.pesos(r.costo)}</b><small>lo invertido en mercadería</small></div>` : ''}
      <div class="t"><span>Valor de venta</span><b>${fmt.pesos(r.venta)}</b><small>a precio de lista</small></div>
      <div class="t${r.negativos ? ' alerta' : ''}"><span>Stock negativo</span><b>${fmt.num(r.negativos)}</b><small>${r.negativos ? 'conviene recontarlas' : 'todo en orden'}</small></div>
      <div class="t"><span>Recuentos abiertos</span><b>${fmt.num(r.recuentos_abiertos)}</b><small>${fmt.num(r.movimientos_7d)} movimientos en 7 días</small></div>`;
  }

  // ---------- pestañas ----------
  let tab = (location.hash || '#stock').slice(1);
  const ir = t => { tab = t; history.replaceState(null, '', '#' + t); $$('#tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === t.split(':')[0] || (b.dataset.tab === 'stock' && t === 'ajustar'))); ({ stock: vistaStock, ajustar: vistaStock, fallas: vistaFallas, recuentos: vistaRecuentos, movimientos: vistaMovimientos })[t.split(':')[0]]?.(t.split(':')[1]); };
  $$('#tabs [data-tab]').forEach(b => b.onclick = () => ir(b.dataset.tab));

  // ================= RECUENTOS =================
  async function vistaRecuentos(abrir) {
    if (abrir) return sesion(abrir);
    const { data } = await sb.from('recuentos').select('*').eq('empresa_id', e).neq('estado', 'descartado').order('creado', { ascending: false }).limit(60);
    const ids = (data || []).map(r => r.id);
    const prog = {}; if (ids.length) { const { data: its } = await sb.from('recuento_items').select('recuento_id,contado,sistema').in('recuento_id', ids); (its || []).forEach(i => { const p = prog[i.recuento_id] = prog[i.recuento_id] || { n: 0, c: 0, d: 0 }; p.n++; if (i.contado != null) { p.c++; if (+i.contado !== +i.sistema) p.d++; } }); }
    const alc = r => r.alcance && r.alcance.tipo === 'familias' ? 'Familias elegidas' : r.alcance && r.alcance.tipo === 'productos' ? 'Productos elegidos' : 'Todo el stock';
    $('#vista').innerHTML = `<div class="vista card"><div class="card-cab"><div><h2>Recuentos</h2><p class="sub">Contá lo que hay (a mano o con el lector) y confirmá: cada diferencia queda registrada como movimiento.</p></div><div class="acciones"><button class="btn primario" id="btn-nuevo-rec">+ Nuevo recuento</button></div></div>
      ${(data || []).length ? `<div class="rec-lista">${data.map(r => { const p = prog[r.id] || { n: 0, c: 0, d: 0 }, pct = p.n ? Math.round(100 * p.c / p.n) : 0;
        return `<div class="rec" data-rec="${r.id}"><div><b>${esc(r.nombre)}</b><small>${fmt.fechaHora(r.creado)} · ${alc(r)}${r.ciego ? ' · a ciegas' : ''}</small></div>
          <div class="barra-w"><div class="barra"><i style="width:${pct}%"></i></div><div class="barra-txt">${fmt.num(p.c)} de ${fmt.num(p.n)} contadas · ${fmt.num(r.estado === 'confirmado' && r.resumen ? r.resumen.movimientos : p.d)} con diferencia</div></div>
          <span class="estado ${r.estado}">${r.estado === 'abierto' ? 'En curso' : r.estado === 'confirmado' ? 'Confirmado' : 'Descartado'}</span>
          <button class="btn chico">${r.estado === 'abierto' ? 'Seguir contando' : 'Ver'}</button></div>`; }).join('')}</div>`
        : `<div class="vacio-grande">${IC_REC}<b>Todavía no hiciste ningún recuento</b>Empezá uno por familia (por ejemplo, Conjuntos) o de todo el local.</div>`}</div>`;
    $$('[data-rec]').forEach(el => el.onclick = () => ir('recuentos:' + el.dataset.rec));
    $('#btn-nuevo-rec').onclick = nuevoRecuento;
  }
  async function nuevoRecuento() {
    const { data: cats } = await sb.from('categorias').select('id,nombre').eq('empresa_id', e).eq('activa', true).order('orden');
    let alcance = 'familias';
    const m = modal(`<h2>Nuevo recuento</h2><p class="sub">Se toma una foto del stock ahora. Lo que se venda mientras contás no se pierde.</p>
      <div class="campo" style="margin-top:12px"><label>Nombre</label><input id="nr-nombre" value="Recuento ${new Date().toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' })}"></div>
      <div class="campo"><label>¿Qué vas a contar?</label><div class="seg" id="nr-alc"><button type="button" data-a="familias" class="on">Algunas familias</button><button type="button" data-a="todo">Todo el local</button></div></div>
      <div id="nr-fams" style="border:1px solid var(--linea);border-radius:12px;padding:4px 12px;max-height:240px;overflow:auto">${(cats || []).map(c => `<label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--linea-suave);cursor:pointer"><input type="checkbox" value="${c.id}" style="width:18px;height:18px;accent-color:var(--acento)">${esc(c.nombre.charAt(0) + c.nombre.slice(1).toLowerCase())}</label>`).join('')}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px"><div><b style="font-size:13.5px">A ciegas</b><div class="sub" style="font-size:12px">No muestra lo que dice el sistema mientras se cuenta (más confiable)</div></div><label class="switch"><input type="checkbox" id="nr-ciego"><span></span></label></div>
      <div class="pie"><button class="btn" data-no>Cancelar</button><button class="btn primario" data-si>Empezar a contar</button></div>`);
    $$('#nr-alc button', m).forEach(b => b.onclick = () => { alcance = b.dataset.a; $$('#nr-alc button', m).forEach(x => x.classList.toggle('on', x === b)); $('#nr-fams', m).style.display = alcance === 'familias' ? '' : 'none'; });
    $('[data-no]', m).onclick = () => m.cerrar();
    $('[data-si]', m).onclick = async () => {
      const ids = $$('#nr-fams input', m).filter(x => x.checked).map(x => x.value);
      if (alcance === 'familias' && !ids.length) { toast('Elegí al menos una familia', 'error'); return; }
      const b = $('[data-si]', m); b.disabled = true; b.textContent = 'Preparando…';

      ${abierto ? `<label class="escaner" id="esc">${IC_ESC}<input id="esc-in" placeholder="Escaneá el código de barras o escribí el código y Enter: suma 1" autocomplete="off"></label>` : ''}

      $('[data-no]', m).onclick = () => m.cerrar();

  // ================= STOCK: buscar una prenda y corregirla (la misma ventana que en Catálogo) =================
  let catalogo = null;
  async function cargarCatalogo() {
    if (catalogo) return catalogo; let todo = [], d = 0;
    while (true) { const { data } = await sb.from('v_variantes').select('id,producto_id,producto_codigo,producto_nombre,producto_tipo,talle_nombre,talle_orden,color_nombre,sku,ean,stock,fallas,foto').eq('empresa_id', e).eq('activa', true).neq('producto_tipo', 'kit').order('producto_nombre').range(d, d + 999); todo = todo.concat(data || []); if (!data || data.length < 1000) break; d += 1000; }

  }
  const refrescar = () => { catalogo = null; pintarTiles(); contarFallas(); ir(tab); };
  const abrirPrenda = vid => PRENDA.abrir(vid, { alGuardar: refrescar });
  const fotoMini = (url, nombre) => url ? `<img class="mini" src="${esc(url)}" alt="" loading="lazy">` : `<span class="mini sf">${esc(APP.iniciales(String(nombre).replace(/[«»\[\]]/g, '')))}</span>`;
  const tyc = x => esc([x.talle_nombre, x.color_nombre].filter(Boolean).join(' · ') || 'Único');

  async function vistaStock() {
    $('#vista').innerHTML = `<div class="vista">
      <div class="card"><div class="card-cab"><div><h2>Corregir una prenda</h2><p class="sub">Buscala o escaneala: se abre su ventana para corregir el stock, marcar fallas o imprimir etiquetas. Es la misma que en el catálogo.</p></div></div>
        <div class="busca-prod"><input id="st-q" placeholder="Cargando el catálogo…" autocomplete="off" disabled><div class="sug" id="st-sug" hidden></div></div>

      <div class="card" style="margin-top:14px"><div class="card-cab"><div><h2>Para revisar</h2><p class="sub">Lo que la caja avisó al vender, el stock negativo y lo marcado "a chequear". Tocá una para corregirla.</p></div></div><div id="st-rev"><p class="sub">Buscando…</p></div></div>
    </div>`;
    pintarRevisar();
    const cat = await cargarCatalogo(), inp = $('#st-q'), sug = $('#st-sug'); if (!inp) return;
    inp.disabled = false; inp.placeholder = 'Nombre, código o escaneá la etiqueta'; inp.focus();
    let tq;
    inp.oninput = () => { clearTimeout(tq); tq = setTimeout(() => {
      const qq = nrm(inp.value.trim()); if (qq.length < 2) { sug.hidden = true; return; }
      const porP = new Map(); cat.forEach(v => { if (qq.split(/\s+/).every(w => nrm(`${v.producto_nombre} ${v.producto_codigo}`).includes(w))) { if (!porP.has(v.producto_id)) porP.set(v.producto_id, []); porP.get(v.producto_id).push(v); } });

      sug.hidden = false; $$('[data-p]', sug).forEach(b => b.onclick = () => { sug.hidden = true; elegirProd(b.dataset.p); }); }, 150); };
    // escáner o código exacto: abre directo la prenda
    inp.onkeydown = ev => { if (ev.key !== 'Enter') return; const c = nrm(inp.value.trim()); const v = cat.find(x => nrm(x.ean) === c || nrm(x.sku) === c);

  function elegirProd(pid) {

  async function pintarRevisar() {

      sb.from('v_stock_revisar').select('*').eq('empresa_id', e).is('resuelto', null).order('creado', { ascending: false }),
      sb.from('v_variantes').select('id,producto_nombre,talle_nombre,color_nombre,stock,foto').eq('empresa_id', e).eq('activa', true).lt('stock', 0).neq('producto_tipo', 'kit'),

    c.innerHTML = filas.size ? `<div class="rev-lista">${[...filas.values()].map(x => `<button class="rev" data-v="${x.id}">${fotoMini(x.foto, x.nombre)}<span class="rev-t"><b>${esc(x.nombre)}</b><small>${tyc(x.t)}</small></span><span class="rev-q">${x.que.map(esc).join('<br>')}</span><span class="rev-s">${fmt.num(x.stock)} u.</span></button>`).join('')}</div>`

    $('#vista').innerHTML = `<div class="vista card"><div class="card-cab"><div><h2>Movimientos de stock</h2><p class="sub">Todo lo que entró y salió, quién lo hizo y por qué</p></div><div class="acciones"><button class="btn" id="mv-csv">Descargar (CSV)</button></div></div>
      <div class="filtros-mov"><input type="date" id="mv-desde" value="${d(7)}"><span class="sub">a</span><input type="date" id="mv-hasta" value="${d(0)}">
        <select id="mv-tipo"><option value="">Todos los tipos</option>${Object.entries(TIPOS_MOV).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
        <input id="mv-q" placeholder="Prenda o código…" style="min-width:220px" value="${esc(movFiltro ? movFiltro.texto : '')}"></div>
      <div id="mv-tabla"></div></div>`;
    let filas = [];
    const cargarMov = async () => {
      let c = sb.from('v_movimientos').select('*').eq('empresa_id', e).gte('fecha', $('#mv-desde').value + 'T00:00:00').lte('fecha', $('#mv-hasta').value + 'T23:59:59').order('fecha', { ascending: false }).limit(1000);
      if ($('#mv-tipo').value) c = c.eq('tipo', $('#mv-tipo').value);
      if (movFiltro && movFiltro.ref) c = c.eq('referencia', movFiltro.ref);
      const { data, error } = await c; if (error) { toast(mensajeError(error), 'error'); return; }
      const qq = nrm($('#mv-q').value); filas = (data || []).filter(m => !qq || (movFiltro && movFiltro.ref) || nrm(`${m.producto_nombre} ${m.producto_codigo} ${m.sku} ${m.talle_nombre || ''} ${m.color_nombre || ''}`).includes(qq));
      const det = m => m.venta_numero ? `Ticket #${String(m.venta_numero).padStart(6, '0')}` : m.recuento_nombre ? esc(m.recuento_nombre) : esc(m.motivo || m.nota || '');
      $('#mv-tabla').innerHTML = filas.length ? `<table class="lista"><tr><th>Fecha</th><th>Prenda</th><th>Tipo</th><th class="num">Cant.</th><th>Detalle</th><th>Quién</th></tr>${filas.slice(0, 400).map(m => `<tr><td style="white-space:nowrap">${fmt.fechaHora(m.fecha)}</td><td><b style="font-weight:600">${esc(m.producto_nombre)}</b><br><small style="color:var(--tinta-3)">${esc([m.talle_nombre, m.color_nombre].filter(Boolean).join(' · ') || m.sku || '')}</small></td><td><span class="tipo ${TIPOS_MOV[m.tipo] ? m.tipo : 'otro'}">${esc(TIPOS_MOV[m.tipo] || m.tipo)}</span></td><td class="num"><span class="cant-mov ${m.cantidad > 0 ? 'pos' : 'neg'}">${m.cantidad > 0 ? '+' : ''}${fmt.num(m.cantidad)}</span></td><td>${det(m)}</td><td>${esc(m.usuario || '—')}</td></tr>`).join('')}</table>${filas.length > 400 ? `<p class="sub" style="margin-top:10px">Se muestran 400 de ${fmt.num(filas.length)}. Achicá las fechas o descargá el CSV.</p>` : ''}` : '<div class="vacio-grande"><b>Sin movimientos con esos filtros</b></div>';
    };
    ['#mv-desde', '#mv-hasta', '#mv-tipo'].forEach(s => $(s).onchange = () => { movFiltro = null; cargarMov(); });
    let tq; $('#mv-q').oninput = () => { clearTimeout(tq); tq = setTimeout(() => { movFiltro = null; cargarMov(); }, 250); };
    $('#mv-csv').onclick = () => { const cab = ['Fecha', 'Código', 'Prenda', 'Talle', 'Color', 'Tipo', 'Cantidad', 'Motivo', 'Detalle', 'Usuario'];
      const lin = filas.map(m => [new Date(m.fecha).toLocaleString('es-AR'), m.sku || m.producto_codigo, m.producto_nombre, m.talle_nombre || '', m.color_nombre || '', TIPOS_MOV[m.tipo] || m.tipo, String(m.cantidad).replace('.', ','), m.motivo || '', m.venta_numero ? 'Ticket #' + m.venta_numero : (m.recuento_nombre || m.nota || ''), m.usuario || '']);
      const csv = '﻿' + [cab, ...lin].map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(';')).join('\r\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `movimientos-${$('#mv-desde').value}-a-${$('#mv-hasta').value}.csv`; a.click(); };
    if (movFiltro) { $('#mv-desde').value = '2020-01-01'; }
    cargarMov();
  }

  pintarTiles(); contarFallas();
  ir(tab);
});
</script>
</body>
</html>
